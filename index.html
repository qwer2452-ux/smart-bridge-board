<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1e3a8a">
    
    <title>Smart Bridge Board</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' } }
                }
            }
        };
    </script>
    <style>
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        body { -webkit-tap-highlight-color: transparent; user-select: none; overscroll-behavior-y: none; height: 100dvh; overflow: hidden; }
        input, select, textarea { user-select: auto; }
    </style>
</head>
<body class="bg-slate-900 flex justify-center text-slate-800 antialiased selection:bg-brand-200">

    <div class="w-full max-w-md bg-slate-50 h-[100dvh] shadow-2xl relative overflow-hidden flex flex-col">

        <!-- ========================================== -->
        <!-- 1. 열람자 모드 (첫 화면 또는 QR 화면) -->
        <!-- ========================================== -->
        <div id="viewer-mode" class="flex flex-col h-full w-full absolute inset-0 bg-slate-50 transition-transform duration-300 transform translate-x-0 z-10">
            <header class="bg-brand-900 text-white p-6 shadow-md rounded-b-2xl">
                <div class="flex items-center justify-between">
                    <div>
                        <h1 id="viewer-header-title" class="text-2xl font-bold tracking-tight">Smart Bridge Board</h1>
                        <p id="viewer-header-subtitle" class="text-brand-100 text-sm mt-1">조회할 선박을 선택하세요</p>
                    </div>
                    <!-- 조타 핸들 아이콘 -->
                    <div class="opacity-90">
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-brand-200 drop-shadow-md">
                            <circle cx="12" cy="12" r="8"></circle>
                            <circle cx="12" cy="12" r="3"></circle>
                            <line x1="12" y1="2" x2="12" y2="4"></line>
                            <line x1="12" y1="20" x2="12" y2="22"></line>
                            <line x1="22" y1="12" x2="20" y2="12"></line>
                            <line x1="4" y1="12" x2="2" y2="12"></line>
                            <line x1="19.07" y1="4.93" x2="17.66" y2="6.34"></line>
                            <line x1="6.34" y1="17.66" x2="4.93" y2="19.07"></line>
                            <line x1="19.07" y1="19.07" x2="17.66" y2="17.66"></line>
                            <line x1="6.34" y1="6.34" x2="4.93" y2="4.93"></line>
                        </svg>
                    </div>
                </div>
            </header>
            
            <main class="flex-1 overflow-y-auto p-4 pb-20">
                <div id="document-list" class="grid grid-cols-2 gap-3">
                    <!-- 선박 목록(첫화면) 또는 문서 목록(QR접속시) 실시간 렌더링 -->
                </div>
            </main>

            <!-- 하단 톱니바퀴 (관리자 로그인) -->
            <footer class="absolute bottom-4 right-4 z-20">
                <button onclick="openLoginModal()" class="bg-white/80 backdrop-blur shadow-md hover:bg-white text-slate-400 hover:text-brand-600 p-3 rounded-full transition-all focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
            </footer>
        </div>

        <!-- ========================================== -->
        <!-- 2. 관리자 로그인 모달 -->
        <!-- ========================================== -->
        <div id="login-modal" class="fixed inset-0 bg-black/70 z-[60] hidden items-center justify-center p-4 backdrop-blur-sm transition-all">
            <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-6 relative">
                <button onclick="closeLoginModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-2xl font-bold">&times;</button>
                <div class="mb-6 text-center">
                    <span class="text-4xl mb-2 block">🔐</span>
                    <h2 class="text-xl font-bold text-slate-800">관리자 로그인</h2>
                    <p class="text-xs text-slate-500 mt-1">안전관리책임자 전용 접근</p>
                </div>
                <form onsubmit="handleLogin(event)" class="flex flex-col gap-4">
                    <input type="email" id="email" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-brand-500 transition-all" placeholder="이메일 주소">
                    <input type="password" id="password" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-brand-500 transition-all" placeholder="비밀번호">
                    <button type="submit" class="w-full bg-brand-600 text-white font-bold py-3.5 rounded-lg mt-2 hover:bg-brand-700 shadow-md transition-all active:scale-95">접속하기</button>
                </form>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- 3. 관리자 모드 (대시보드) -->
        <!-- ========================================== -->
        <div id="admin-mode" class="flex flex-col h-full w-full absolute inset-0 bg-slate-100 transition-transform duration-300 transform translate-x-full z-50">
            <header class="bg-slate-800 text-white p-4 shadow-md flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <button onclick="goBackToViewer()" class="text-white hover:text-brand-200 transition-colors p-1" title="열람화면으로 돌아가기">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3" /></svg>
                    </button>
                    <h1 class="text-lg font-bold">⚙️ 관리자 모드</h1>
                </div>
                <button onclick="handleLogout()" class="text-xs font-bold bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg transition-colors">로그아웃</button>
            </header>
            
            <main class="flex-1 overflow-y-auto p-4 flex flex-col gap-5 pb-10">
                <!-- 선박 선택/관리 섹션 -->
                <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-3">
                    <div class="flex justify-between items-center">
                        <label class="block text-sm font-extrabold text-brand-900">🚢 선박 관리 및 선택</label>
                        <div class="flex gap-1.5">
                            <button onclick="addNewShip()" class="bg-brand-100 text-brand-700 hover:bg-brand-200 font-bold px-2 py-1.5 rounded text-xs transition-colors">+ 추가</button>
                            <button onclick="editCurrentShip()" class="bg-slate-100 text-slate-600 hover:bg-slate-200 font-bold px-2 py-1.5 rounded text-xs transition-colors">수정</button>
                            <button onclick="deleteCurrentShip()" class="bg-red-50 text-red-600 hover:bg-red-100 font-bold px-2 py-1.5 rounded text-xs transition-colors">삭제</button>
                        </div>
                    </div>
                    <select id="admin-ship-select" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-800 outline-none focus:ring-2 focus:ring-brand-500 appearance-none"></select>
                </section>

                <!-- 문서 업로드 섹션 -->
                <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-sm font-extrabold text-slate-800 mb-3 border-b border-slate-100 pb-2">📤 문서 등록</h2>
                    <form onsubmit="handleUpload(event)" class="flex flex-col gap-3">
                        <input type="text" id="doc-title" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-slate-800 text-sm" placeholder="문서 제목 (예: 비상대응매뉴얼)">
                        <input type="file" id="file-upload" class="w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 cursor-pointer" accept=".pdf, image/*" multiple required>
                        <button type="submit" class="w-full bg-slate-800 text-white font-bold py-3 rounded-xl hover:bg-slate-900 shadow-md transition-all active:scale-95 mt-1">이 선박에 등록하기</button>
                    </form>
                </section>

                <!-- 문서 관리 목록 섹션 -->
                <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex-1">
                    <h2 class="text-sm font-extrabold text-slate-800 mb-3 border-b border-slate-100 pb-2 flex justify-between">
                        <span>📁 등록된 문서 관리</span>
                        <span id="admin-doc-count" class="text-brand-600 bg-brand-50 px-2 py-0.5 rounded text-xs">0건</span>
                    </h2>
                    <ul id="admin-doc-list" class="flex flex-col gap-2"></ul>
                </section>
            </main>
        </div>

        <!-- ========================================== -->
        <!-- 4. 커스텀 프롬프트/알림 모달 (에러 방지용) -->
        <!-- ========================================== -->
        <div id="custom-prompt-modal" class="fixed inset-0 bg-black/60 z-[100] hidden items-center justify-center p-4 backdrop-blur-sm transition-all">
            <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl text-center">
                <h3 id="custom-prompt-msg" class="text-lg font-bold text-slate-800 mb-4 whitespace-pre-line">알림</h3>
                <input type="text" id="custom-prompt-input" class="w-full px-4 py-3 border border-slate-300 rounded-xl mb-5 outline-none focus:ring-2 focus:ring-brand-500 text-center font-medium">
                <div class="flex justify-center gap-2">
                    <button id="custom-prompt-cancel" onclick="closeCustomPrompt(false)" class="w-1/2 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold transition-colors">취소</button>
                    <button onclick="closeCustomPrompt(true)" class="w-1/2 py-3 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-bold shadow-md transition-colors">확인</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Firebase SDK & 비즈니스 로직 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp, query } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAo7hgaaj4NedahYZFEQfZqbIVi596A_XQ",
            authDomain: "smart-bridge-board.firebaseapp.com",
            projectId: "smart-bridge-board",
            storageBucket: "smart-bridge-board.firebasestorage.app",
            messagingSenderId: "81406484031",
            appId: "1:81406484031:web:68bb7580e46b1d5348628a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let allDocuments = [];
        let dynamicShips = []; // DB + LocalStorage 하이브리드 조합을 위해 초기화

        // =====================================
        // UI & 모달 제어 함수
        // =====================================
        window.openLoginModal = () => {
            document.getElementById('login-modal').classList.remove('hidden');
            document.getElementById('login-modal').classList.add('flex');
        };
        window.closeLoginModal = () => {
            document.getElementById('login-modal').classList.add('hidden');
            document.getElementById('login-modal').classList.remove('flex');
        };
        window.goBackToViewer = () => {
            document.getElementById('admin-mode').classList.add('translate-x-full');
            document.getElementById('viewer-mode').classList.remove('-translate-x-full');
            renderDocuments(); // 돌아갈 때 화면 갱신
        };

        let promptCallback = null;
        window.showPrompt = (msg, defaultVal, isAlertOnly, callback) => {
            document.getElementById('custom-prompt-msg').innerText = msg;
            const input = document.getElementById('custom-prompt-input');
            const cancelBtn = document.getElementById('custom-prompt-cancel');
            
            if (isAlertOnly) {
                input.style.display = 'none';
                cancelBtn.style.display = 'none';
            } else {
                input.style.display = 'block';
                cancelBtn.style.display = 'block';
                input.value = defaultVal || '';
            }

            document.getElementById('custom-prompt-modal').classList.remove('hidden');
            document.getElementById('custom-prompt-modal').classList.add('flex');
            
            if(!isAlertOnly) setTimeout(() => input.focus(), 100);
            promptCallback = callback;
        };

        window.closeCustomPrompt = (isOk) => {
            document.getElementById('custom-prompt-modal').classList.add('hidden');
            document.getElementById('custom-prompt-modal').classList.remove('flex');
            if(promptCallback) {
                promptCallback(isOk ? document.getElementById('custom-prompt-input').value : null);
            }
        };

        const showAlert = (msg, callback) => { window.showPrompt(msg, "", true, callback); };

        // =====================================
        // 인증 (로그인/로그아웃)
        // =====================================
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('admin-mode').classList.remove('translate-x-full');
                document.getElementById('viewer-mode').classList.add('-translate-x-full');
                closeLoginModal();
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
                renderDocuments();
            } else {
                document.getElementById('admin-mode').classList.add('translate-x-full');
                document.getElementById('viewer-mode').classList.remove('-translate-x-full');
                // Ensure viewer mode rendering is correct when logged out
                renderDocuments();
            }
        });

        window.handleLogin = async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = "확인 중..."; btn.disabled = true;
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
            } catch (error) { 
                console.error("Login Error:", error);
                // Improved error handling to provide better feedback
                if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                    showAlert("이메일 또는 비밀번호가 올바르지 않습니다.");
                } else if (error.code === 'auth/too-many-requests') {
                    showAlert("로그인 시도가 너무 많습니다. 잠시 후 다시 시도해주세요.");
                } else {
                    showAlert(`로그인 오류가 발생했습니다. (${error.message})`);
                }
            } finally {
                btn.innerText = originalText; btn.disabled = false;
            }
        };
        window.handleLogout = async () => { 
            await signOut(auth); 
            // Reset the select box to the first option (or empty) upon logout
            document.getElementById('admin-ship-select').value = '';
            // URL 파라미터 초기화하여 전체 목록 화면으로 이동
            window.history.pushState({}, '', window.location.pathname);
            renderDocuments();
        };

        // =====================================
        // 선박 관리 (DB 연동 + 하이브리드 로컬)
        // =====================================
        const getLocalShips = () => JSON.parse(localStorage.getItem('smartBridgeShips')) || [];
        const saveLocalShips = (ships) => localStorage.setItem('smartBridgeShips', JSON.stringify(ships));

        const updateShipSelectOptions = (selectedShip = null) => {
            const selectEl = document.getElementById('admin-ship-select');
            const currentVal = selectedShip || selectEl.value || (dynamicShips.length > 0 ? dynamicShips[0] : '');
            
            selectEl.innerHTML = '';
            if (dynamicShips.length === 0) {
                selectEl.innerHTML = '<option value="">선박을 추가해주세요 (+버튼)</option>';
                return;
            }
            dynamicShips.forEach(ship => {
                const opt = document.createElement('option');
                opt.value = ship;
                opt.textContent = `🚢 ${ship}`;
                if(ship === currentVal) opt.selected = true;
                selectEl.appendChild(opt);
            });
        };

        window.addNewShip = () => {
            window.showPrompt("추가할 선박 이름을 입력하세요\n(예: 한라산호, 제1여객선)", "", false, (shipName) => {
                if(shipName && shipName.trim()) {
                    const trimmed = shipName.trim();
                    let localShips = getLocalShips();
                    if(!localShips.includes(trimmed)) {
                        localShips.push(trimmed);
                        saveLocalShips(localShips);
                    }
                    if(!dynamicShips.includes(trimmed)) dynamicShips.push(trimmed);
                    
                    updateShipSelectOptions(trimmed);
                    renderDocuments();
                    showAlert(`'${trimmed}' 선박이 추가되었습니다.`);
                }
            });
        };

        window.editCurrentShip = () => {
            const currentShip = document.getElementById('admin-ship-select').value;
            if(!currentShip) return showAlert("수정할 선박이 없습니다.");
            
            window.showPrompt(`'${currentShip}' 선박의 새 이름 입력:`, currentShip, false, (newName) => {
                if(newName && newName.trim() && newName.trim() !== currentShip) {
                    const trimmed = newName.trim();
                    // 로컬스토리지 업데이트
                    let localShips = getLocalShips();
                    if(localShips.includes(currentShip)) {
                        localShips[localShips.indexOf(currentShip)] = trimmed;
                        saveLocalShips(localShips);
                    }
                    // 알림 (DB 문서는 일괄 변경하기 복잡하므로 이름만 변경 허용)
                    showAlert(`이름이 변경되었습니다.\n(주의: 기존에 등록된 문서는 이전 이름으로 유지됩니다.)`);
                    dynamicShips[dynamicShips.indexOf(currentShip)] = trimmed;
                    updateShipSelectOptions(trimmed);
                    renderDocuments();
                }
            });
        };

        window.deleteCurrentShip = () => {
            const currentShip = document.getElementById('admin-ship-select').value;
            if(!currentShip) return;
            
            window.showPrompt(`'${currentShip}' 선박을 목록에서 삭제할까요?\n(등록된 문서는 DB에 남아있습니다.)`, "삭제라고 적어주세요 (생략가능)", false, (res) => {
                if(res !== null) {
                    let localShips = getLocalShips();
                    localShips = localShips.filter(s => s !== currentShip);
                    saveLocalShips(localShips);
                    
                    dynamicShips = dynamicShips.filter(s => s !== currentShip);
                    updateShipSelectOptions();
                    renderDocuments();
                }
            });
        };

        // =====================================
        // 메인 렌더링 로직 (핵심)
        // =====================================
        const renderDocuments = () => {
            const publicList = document.getElementById('document-list');
            const adminList = document.getElementById('admin-doc-list');
            const adminDocCount = document.getElementById('admin-doc-count');
            const viewerTitleEl = document.getElementById('viewer-header-title');
            const viewerSubtitleEl = document.getElementById('viewer-header-subtitle');
            
            publicList.innerHTML = '';
            adminList.innerHTML = '';

            const urlParams = new URLSearchParams(window.location.search);
            const viewerShipId = urlParams.get('ship');
            const isAdmin = auth.currentUser !== null;
            
            updateShipSelectOptions();
            const adminShipId = document.getElementById('admin-ship-select').value;

            // --- 1. 관리자 화면 렌더링 ---
            if (isAdmin) {
                const adminDocs = allDocuments.filter(d => d.shipId === adminShipId);
                adminDocCount.innerText = `${adminDocs.length}건`;
                
                if (adminDocs.length === 0) {
                    adminList.innerHTML = `<div class="text-center py-10 text-slate-400 bg-slate-50 rounded-xl border border-dashed border-slate-300 text-sm font-medium">선택된 선박에 등록된 문서가 없습니다.</div>`;
                } else {
                    adminDocs.forEach(data => {
                        const li = document.createElement('li');
                        li.className = "bg-white p-3.5 rounded-xl border border-slate-100 shadow-sm flex justify-between items-center gap-3";
                        const safePaths = JSON.stringify(data.filePaths || []).replace(/"/g, '&quot;');
                        li.innerHTML = `
                            <div class="flex items-center gap-2 overflow-hidden">
                                <span class="bg-blue-50 text-blue-600 px-2 py-1 rounded text-[10px] font-extrabold flex-shrink-0">PDF/IMG</span>
                                <span class="font-bold text-slate-700 text-sm truncate">${data.title}</span>
                            </div>
                            <button onclick="handleDelete('${data.id}', ${safePaths})" class="text-red-500 hover:bg-red-50 text-xs font-bold px-3 py-1.5 rounded-lg border border-red-100 transition-colors flex-shrink-0">삭제</button>
                        `;
                        adminList.appendChild(li);
                    });
                }
            } 
            // --- 2. 열람자 화면 렌더링 ---
            else {
                if (viewerShipId) {
                    // [QR 코드 스캔 접속] : 해당 선박 문서만 노출
                    viewerTitleEl.textContent = viewerShipId;
                    viewerSubtitleEl.textContent = '안전관리 및 대응매뉴얼 게시판';
                    const shipDocs = allDocuments.filter(d => d.shipId === viewerShipId);
                    
                    if(shipDocs.length === 0) {
                        publicList.innerHTML = `<div class="col-span-2 text-center py-16 bg-white rounded-2xl shadow-sm border border-slate-100 text-slate-400 font-medium">등록된 문서가 없습니다.</div>`;
                    } else {
                        shipDocs.forEach(data => {
                            const btn = document.createElement('button');
                            btn.className = "bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center gap-3 hover:bg-brand-50 hover:border-brand-300 transition-all active:scale-95";
                            btn.onclick = () => window.open(data.fileUrls[0], '_blank');
                            
                            let icon = '📄';
                            if(data.title.includes('비상') || data.title.includes('대응')) icon = '🚨';
                            else if(data.title.includes('도면') || data.title.includes('항로')) icon = '🗺️';
                            else if(data.title.includes('명부')) icon = '👥';
                            
                            btn.innerHTML = `
                                <span class="text-4xl drop-shadow-sm">${icon}</span>
                                <span class="font-bold text-sm text-slate-700 text-center leading-tight break-keep">${data.title}</span>
                            `;
                            publicList.appendChild(btn);
                        });
                    }
                } else {
                    // [기본 주소 접속] : 전체 선박 목록을 버튼으로 표시
                    viewerTitleEl.textContent = 'Smart Bridge Board';
                    viewerSubtitleEl.textContent = '조회하실 선박을 선택해주세요';
                    
                    if (dynamicShips.length === 0) {
                        publicList.innerHTML = `<div class="col-span-2 text-center py-16 bg-white rounded-2xl shadow-sm border border-slate-100 text-slate-400 font-medium">운영 중인 선박이 없습니다.</div>`;
                    } else {
                        dynamicShips.forEach(ship => {
                            const btn = document.createElement('button');
                            btn.className = "col-span-2 bg-white p-6 rounded-2xl shadow-md border-b-4 border-slate-200 flex items-center justify-between hover:bg-brand-50 hover:border-brand-200 transition-all active:scale-95 active:border-b-0 active:translate-y-1 mb-2";
                            btn.onclick = () => { 
                                // URL 변경 및 리렌더링으로 페이지 이동 없이 화면 전환
                                window.history.pushState({}, '', `?ship=${encodeURIComponent(ship)}`);
                                renderDocuments(); 
                            };
                            
                            const docCount = allDocuments.filter(d => d.shipId === ship).length;
                            
                            btn.innerHTML = `
                                <div class="flex items-center gap-4">
                                    <span class="text-4xl">🚢</span>
                                    <div class="text-left">
                                        <div class="font-extrabold text-slate-800 text-lg">${ship}</div>
                                        <div class="text-xs font-bold text-brand-600 mt-0.5">등록 문서 ${docCount}건</div>
                                    </div>
                                </div>
                                <span class="text-slate-300 font-bold text-xl">❯</span>
                            `;
                            publicList.appendChild(btn);
                        });
                    }
                }
            }
        };

        // 브라우저 뒤로가기 버튼 처리
        window.addEventListener('popstate', renderDocuments);

        document.getElementById('admin-ship-select').addEventListener('change', renderDocuments);

        // =====================================
        // DB 실시간 동기화 (onSnapshot)
        // =====================================
        onSnapshot(query(collection(db, "bulletins")), (snapshot) => {
            allDocuments = [];
            let dbShips = new Set(); // DB에 존재하는 배 이름들 자동 수집
            
            snapshot.forEach(doc => {
                const data = doc.data();
                allDocuments.push({ id: doc.id, ...data });
                if(data.shipId) dbShips.add(data.shipId);
            });

            // 문서 최신순 정렬
            allDocuments.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));

            // 로컬에 저장된 껍데기(아직 문서 없는 배) + 실제 문서가 있는 배 완벽 병합!
            const localShips = getLocalShips();
            dynamicShips = [...new Set([...localShips, ...dbShips])];
            
            renderDocuments();
        });

        // =====================================
        // 파일 업로드 및 삭제
        // =====================================
        window.handleUpload = async (e) => {
            e.preventDefault();
            const targetShipId = document.getElementById('admin-ship-select').value;
            if(!targetShipId) return showAlert("선박을 먼저 추가해주세요.");
            
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = "서버로 전송 중... ⏳"; 
            btn.disabled = true;
            btn.classList.add('opacity-70');
            
            try {
                const files = Array.from(document.getElementById('file-upload').files);
                const fileUrls = [];
                const filePaths = [];
                
                for(let file of files) {
                    const filePath = `bulletins/${Date.now()}_${Math.floor(Math.random()*1000)}_${file.name}`;
                    const storageRef = ref(storage, filePath);
                    await uploadBytes(storageRef, file);
                    fileUrls.push(await getDownloadURL(storageRef));
                    filePaths.push(filePath);
                }
                
                await addDoc(collection(db, "bulletins"), {
                    title: document.getElementById('doc-title').value,
                    fileUrls: fileUrls,
                    filePaths: filePaths,
                    shipId: targetShipId,
                    createdAt: serverTimestamp()
                });
                
                document.getElementById('doc-title').value = '';
                document.getElementById('file-upload').value = '';
                showAlert(`'${targetShipId}'에 성공적으로 등록되었습니다!`);
            } catch(error) { 
                console.error(error);
                showAlert("업로드 실패! 파일 용량이나 네트워크를 확인하세요."); 
            }
            
            btn.innerText = originalText; 
            btn.disabled = false;
            btn.classList.remove('opacity-70');
        };

        window.handleDelete = (docId, filePaths) => {
            window.showPrompt("정말 이 문서를 삭제하시겠습니까?", "", false, async (res) => {
                if(res !== null) { // 확인 누름
                    try {
                        // 스토리지 파일들 삭제 시도
                        if(filePaths && filePaths.length > 0) {
                            for(let path of filePaths) {
                                try { await deleteObject(ref(storage, path)); } catch(e) { console.warn("파일 삭제 스킵", e); }
                            }
                        }
                        // DB 문서 삭제
                        await deleteDoc(doc(db, "bulletins", docId));
                        showAlert("문서가 깔끔하게 삭제되었습니다.");
                    } catch(error) {
                        showAlert("삭제 중 오류가 발생했습니다.");
                    }
                }
            });
        };
    </script>
</body>
</html>
