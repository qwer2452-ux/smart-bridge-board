<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Bridge Board</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 900: '#0c4a6e' }
                    }
                }
            }
        }
    </script>
    <!-- PDF.js for Viewer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Panzoom for Image Zooming -->
    <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; -webkit-tap-highlight-color: transparent; }
        
        /* Modal Animation */
        .modal-overlay { opacity: 0; visibility: hidden; transition: all 0.2s ease-out; backdrop-filter: blur(4px); }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { transform: scale(0.95) translateY(10px); opacity: 0; transition: all 0.2s ease-out; }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); opacity: 1; }

        /* Viewer Overlay */
        #viewer-overlay { opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        #viewer-overlay.active { opacity: 1; visibility: visible; }
        
        .hide { display: none !important; }
        .loader { border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #0ea5e9; width: 24px; height: 24px; -webkit-animation: spin 1s linear infinite; animation: spin 1s linear infinite; }
        @-webkit-keyframes spin { 0% { -webkit-transform: rotate(0deg); } 100% { -webkit-transform: rotate(360deg); } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="antialiased min-h-screen">

    <!-- 1. 로그인 화면 (하늘색 바탕) -->
    <div id="login-view" class="fixed inset-0 bg-sky-50 flex flex-col items-center justify-center p-6 z-10 hide">
        <div class="w-full max-w-sm bg-white rounded-3xl p-8 shadow-xl border border-sky-100 relative overflow-hidden">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-500 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/30">
                    <!-- 조타 핸들 아이콘 -->
                    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"></circle>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2v3m0 14v3m10-10h-3M5 12H2m15.536-7.536l-2.121 2.121M6.586 17.414l-2.121 2.121m12.02-12.02l-2.121 2.121M6.586 6.586L4.464 4.464"></path>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Smart Bridge Board</h1>
                <p class="text-slate-500 mt-2 text-sm">관리자 전용 로그인</p>
            </div>
            <div class="space-y-4">
                <input type="email" id="email" placeholder="이메일 주소" class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all placeholder-slate-400">
                <input type="password" id="password" placeholder="비밀번호" class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-4 py-3.5 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all placeholder-slate-400" onkeyup="if(event.key === 'Enter') login()">
                <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl px-4 py-3.5 mt-2 transition-all shadow-md active:scale-[0.98]">
                    로그인
                </button>
            </div>
        </div>
    </div>

    <!-- 2. 관리자 대시보드 (화이트/밝은회색 바탕) -->
    <div id="admin-view" class="min-h-screen bg-slate-50 pb-20 hide">
        <header class="bg-white sticky top-0 z-20 border-b border-slate-200 shadow-sm">
            <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-blue-100 rounded-lg flex items-center justify-center">
                        <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <h1 class="font-bold text-lg text-slate-800">내 선박 관리</h1>
                </div>
                <button onclick="logout()" class="text-sm text-slate-500 hover:text-slate-800 bg-slate-100 px-3 py-1.5 rounded-lg transition-colors font-medium">로그아웃</button>
            </div>
        </header>
        
        <main class="max-w-3xl mx-auto p-4 space-y-6 mt-4">
            
            <!-- 선박 관리 섹션 -->
            <section class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold text-slate-800 flex items-center gap-2">
                        <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                        선박 선택 및 관리
                    </h2>
                    <button onclick="showAddShipModal()" class="text-sm bg-slate-100 text-blue-600 px-3 py-1.5 rounded-lg font-medium hover:bg-slate-200 transition-colors">+ 새 선박 추가</button>
                </div>
                
                <select id="admin-ship-select" onchange="loadAdminDocs()" class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 font-medium mb-3 appearance-none">
                    <!-- Options JS Render -->
                </select>

                <div id="ship-actions" class="grid grid-cols-2 gap-2 hide mt-4">
                    <button onclick="showEditShipModal()" class="bg-slate-100 text-slate-700 py-2.5 rounded-xl font-medium text-sm hover:bg-slate-200">이름 수정</button>
                    <button onclick="confirmDeleteShip()" class="bg-red-50 text-red-600 py-2.5 rounded-xl font-medium text-sm hover:bg-red-100">선박 삭제</button>
                    <button onclick="showQRCodeModal()" class="bg-blue-50 text-blue-600 py-2.5 rounded-xl font-medium text-sm hover:bg-blue-100 col-span-1">QR코드 생성</button>
                    <button onclick="copyShipLink()" class="bg-indigo-50 text-indigo-600 py-2.5 rounded-xl font-medium text-sm hover:bg-indigo-100 col-span-1">열람 링크 복사</button>
                    <button onclick="previewPublicView()" class="col-span-2 bg-slate-800 text-white py-3 rounded-xl font-medium text-sm hover:bg-slate-700 shadow-sm">📱 열람자 화면 미리보기</button>
                </div>
            </section>

            <!-- 문서 등록 섹션 -->
            <section class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm relative overflow-hidden">
                <div id="upload-overlay" class="absolute inset-0 bg-white/90 backdrop-blur-sm z-10 flex flex-col items-center justify-center hide">
                    <div class="loader mb-3"></div>
                    <p id="upload-progress-text" class="text-blue-600 font-bold text-sm">업로드 중... 0%</p>
                </div>

                <h2 class="font-bold text-slate-800 flex items-center gap-2 mb-4">
                    <svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    새 문서 등록 (PDF / 이미지)
                </h2>
                <div class="space-y-3">
                    <input type="text" id="doc-title" placeholder="문서 제목 (예: 안전관리자 임명장)" class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 placeholder-slate-400">
                    <div class="relative">
                        <input type="file" id="doc-file" accept=".pdf, image/jpeg, image/png" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="updateFileName()">
                        <div id="file-drop-area" class="w-full bg-slate-50 border-2 border-dashed border-slate-300 text-slate-500 rounded-xl px-4 py-6 text-center transition-colors">
                            <svg class="w-8 h-8 mx-auto mb-2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                            <span id="file-name-display" class="font-medium text-sm">터치하여 파일 선택 (최대 20MB)</span>
                        </div>
                    </div>
                    <button onclick="uploadDocument()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3.5 rounded-xl transition-colors shadow-sm active:scale-[0.98]">
                        게시물 등록하기
                    </button>
                </div>
            </section>

            <!-- 등록된 문서 목록 -->
            <section>
                <h2 class="font-bold text-slate-800 flex items-center gap-2 mb-3 px-1">
                    <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    등록된 문서 관리
                </h2>
                <div id="admin-doc-list" class="space-y-3">
                    <!-- Docs JS Render -->
                </div>
            </section>
        </main>
    </div>

    <!-- 3. 일반 열람자 화면 (화이트 바탕) -->
    <div id="public-view" class="min-h-screen bg-slate-50 pb-10 hide">
        <header class="bg-white sticky top-0 z-10 border-b border-slate-200 shadow-sm">
            <div class="max-w-3xl mx-auto px-5 py-4 flex flex-col items-center">
                <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mb-2 shadow-sm border border-blue-100">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0"></path></svg>
                </div>
                <h1 id="public-ship-name" class="font-bold text-xl text-slate-800 tracking-tight">로딩 중...</h1>
                <p class="text-slate-500 text-sm mt-1">Smart Bridge Board</p>
            </div>
        </header>
        <main class="max-w-3xl mx-auto p-4 mt-2">
            <p class="text-sm font-medium text-slate-500 mb-3 ml-1">열람할 문서를 선택하세요</p>
            <div id="public-doc-list" class="space-y-3">
                <!-- Docs JS Render -->
            </div>
        </main>
        <!-- 관리자 대시보드 복귀 버튼 (로그인 상태일 때만 표시) -->
        <div id="return-admin-btn" class="fixed bottom-6 right-6 z-20 hide">
            <button onclick="returnToAdmin()" class="bg-slate-800 text-white shadow-lg rounded-full px-5 py-3 font-semibold flex items-center gap-2 hover:bg-slate-700 active:scale-95 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                관리자로 복귀
            </button>
        </div>
    </div>

    <!-- 4. 문서 뷰어 모달 (다크 모드 유지) -->
    <div id="viewer-overlay" class="fixed inset-0 bg-black/95 z-50 flex flex-col hide">
        <div class="h-14 bg-black/80 border-b border-white/10 flex items-center justify-between px-4 shrink-0">
            <span id="viewer-title" class="text-white font-medium truncate pr-4 text-sm">문서 보기</span>
            <button onclick="closeViewer()" class="text-white/70 hover:text-white p-2 rounded-lg bg-white/5 active:scale-95 transition-transform">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div id="viewer-content" class="flex-1 w-full h-full relative overflow-hidden flex items-center justify-center">
            <!-- Content Injected Here -->
            <div id="viewer-loader" class="absolute inset-0 flex items-center justify-center z-10 bg-black">
                <div class="loader"></div>
            </div>
        </div>
    </div>

    <!-- 5. 커스텀 알림창 (Alert Modal) -->
    <div id="custom-alert" class="fixed inset-0 z-[60] flex items-center justify-center modal-overlay px-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl modal-content border border-slate-100">
            <div id="alert-icon" class="w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-4 bg-blue-100 text-blue-500">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <h3 id="alert-title" class="text-lg font-bold text-center text-slate-800 mb-2">알림</h3>
            <p id="alert-message" class="text-slate-600 text-center text-sm mb-6 break-keep">메시지</p>
            <div id="alert-buttons" class="flex gap-2 justify-center">
                <button id="alert-ok-btn" class="flex-1 bg-blue-600 text-white font-semibold py-3 rounded-xl hover:bg-blue-700 active:scale-95 transition-all">확인</button>
            </div>
        </div>
    </div>

    <!-- 6. 입력 모달 (Prompt Modal) -->
    <div id="custom-prompt" class="fixed inset-0 z-[60] flex items-center justify-center modal-overlay px-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl modal-content border border-slate-100">
            <h3 id="prompt-title" class="text-lg font-bold text-slate-800 mb-2">입력</h3>
            <p id="prompt-message" class="text-slate-500 text-sm mb-4">내용을 입력하세요</p>
            <input type="text" id="prompt-input" class="w-full bg-slate-50 border border-slate-200 text-slate-800 rounded-xl px-4 py-3 mb-5 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100">
            <div class="flex gap-2">
                <button onclick="closePrompt(null)" class="flex-1 bg-slate-100 text-slate-600 font-semibold py-3 rounded-xl hover:bg-slate-200 active:scale-95 transition-all">취소</button>
                <button id="prompt-submit-btn" class="flex-1 bg-blue-600 text-white font-semibold py-3 rounded-xl hover:bg-blue-700 active:scale-95 transition-all">확인</button>
            </div>
        </div>
    </div>

    <!-- 7. QR 코드 모달 -->
    <div id="qr-modal" class="fixed inset-0 z-[60] flex items-center justify-center modal-overlay px-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl modal-content border border-slate-100 flex flex-col items-center">
            <h3 class="text-lg font-bold text-slate-800 mb-1" id="qr-modal-title">QR 코드</h3>
            <p class="text-slate-500 text-sm mb-5 text-center">조타실에 부착하여 열람용으로 사용하세요.</p>
            
            <div id="qrcode-container" class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-4"></div>
            <p id="qr-link-text" class="text-xs text-slate-400 break-all text-center mb-6 px-2"></p>
            
            <div class="flex gap-2 w-full">
                <button onclick="closeQRModal()" class="flex-1 bg-slate-100 text-slate-600 font-semibold py-3 rounded-xl hover:bg-slate-200 active:scale-95 transition-all">닫기</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, getDoc, onSnapshot, query, where, orderBy, updateDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // === 🚨 아래 firebaseConfig를 대표님의 진짜 키값으로 적용 완료! ===
        const firebaseConfig = {
            apiKey: "AIzaSyAo7hgaaj4NedahYZFEQfZqbIVi596A_XQ",
            authDomain: "smart-bridge-board.firebaseapp.com",
            projectId: "smart-bridge-board",
            storageBucket: "smart-bridge-board.firebasestorage.app",
            messagingSenderId: "81406484031",
            appId: "1:81406484031:web:68bb7580e46b1d5348628a",
            measurementId: "G-7D68RX6RTB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const auth = getAuth(app);

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        // 상태 변수
        let currentUser = null;
        let unsubAdminShips = null;
        let unsubAdminDocs = null;
        let unsubPublicDocs = null;
        let panzoomInstance = null;
        let qrCodeInstance = null;

        const urlParams = new URLSearchParams(window.location.search);
        let viewShipId = urlParams.get('ship');

        // === 라우팅 및 인증 상태 감지 ===
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (viewShipId) {
                // 파라미터가 있으면 무조건 열람 모드로 진입
                showView('public-view');
                if(user) document.getElementById('return-admin-btn').classList.remove('hide');
                else document.getElementById('return-admin-btn').classList.add('hide');
                loadPublicData();
            } else if (user) {
                showView('admin-view');
                document.getElementById('return-admin-btn').classList.add('hide');
                loadAdminShips();
            } else {
                showView('login-view');
                document.getElementById('return-admin-btn').classList.add('hide');
            }
        });

        const showView = (viewId) => {
            ['login-view', 'admin-view', 'public-view'].forEach(id => {
                document.getElementById(id).classList.add('hide');
            });
            document.getElementById(viewId).classList.remove('hide');
        };

        window.returnToAdmin = () => {
            viewShipId = null;
            // 파라미터 조용히 제거 (Iframe 에러 방지 위해 try-catch 적용)
            try { window.history.replaceState({}, document.title, window.location.pathname); } catch(e) {}
            showView('admin-view');
            loadAdminShips();
        };

        window.previewPublicView = () => {
            const select = document.getElementById('admin-ship-select');
            if(!select.value) return showAlert("선박을 먼저 선택하세요.");
            viewShipId = select.value;
            try { window.history.replaceState({}, document.title, `${window.location.pathname}?ship=${viewShipId}`); } catch(e) {}
            showView('public-view');
            document.getElementById('return-admin-btn').classList.remove('hide');
            loadPublicData();
        };

        window.login = async () => {
            const email = document.getElementById('email').value;
            const pw = document.getElementById('password').value;
            if(!email || !pw) return showAlert("이메일과 비밀번호를 입력하세요.");
            try {
                await signInWithEmailAndPassword(auth, email, pw);
                try { window.history.replaceState({}, document.title, window.location.pathname); } catch(e) {} // URL 정리 (에러 무시)
                viewShipId = null;
            } catch (error) {
                showAlert("아이디 또는 비밀번호가 올바르지 않습니다.", "error");
            }
        };

        window.logout = async () => {
            if(await showConfirm("로그아웃 하시겠습니까?")) {
                await signOut(auth);
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
            }
        };

        // === 🛳️ 선박 관리 (관리자) ===
        const loadAdminShips = () => {

        window.uploadDocument = async () => {
            const select = document.getElementById('admin-ship-select');
            const shipId = select.value;
            if(!shipId) return showAlert("선박을 먼저 선택(또는 추가)해주세요.");

            const titleInput = document.getElementById('doc-title');
            const fileInput = document.getElementById('doc-file');
            const title = titleInput.value.trim();
            const file = fileInput.files[0];

            if(!title) return showAlert("문서 제목을 입력해주세요.");
            if(!file) return showAlert("업로드할 파일을 선택해주세요.");

            // 현재 파일 개수 체크 (10개 제한)
            const listDiv = document.getElementById('admin-doc-list');
            if (listDiv.childElementCount >= 10 && !listDiv.querySelector('p')) {
                return showAlert("한 선박당 최대 10개의 문서만 등록할 수 있습니다.", "error");
            }

            const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
            const isImage = file.type.startsWith('image/') || file.name.toLowerCase().match(/\.(jpg|jpeg|png)$/);
            
            if(!isPdf && !isImage) return showAlert("PDF 또는 이미지(JPG, PNG) 파일만 가능합니다.", "error");
            
            const fileTypeStr = isPdf ? 'pdf' : 'image';
            const overlay = document.getElementById('upload-overlay');
            const progressText = document.getElementById('upload-progress-text');
            overlay.classList.remove('hide');

            const fileName = `${Date.now()}_${file.name}`;
            const storagePath = `bulletins/${currentUser.uid}/${fileName}`;
            const storageRef = ref(storage, storagePath);
            const uploadTask = uploadBytesResumable(storageRef, file);

            uploadTask.on('state_changed', 
                (snapshot) => {
                    const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                    progressText.textContent = `업로드 중... ${Math.round(progress)}%`;
                }, 
                (error) => {
                    console.error(error);
                    overlay.classList.add('hide');
                    showAlert("파일 업로드에 실패했습니다.", "error");
                }, 
                async () => {
                    try {
                        const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);
                        
                        await addDoc(collection(db, 'bulletins'), {
                            shipId: shipId,
                            ownerId: currentUser.uid,
                            title: title,
                            fileUrl: downloadURL,
                            fileType: fileTypeStr,
                            storagePath: storagePath,
                            createdAt: Date.now()
                        });

                        titleInput.value = '';
                        fileInput.value = '';
                        updateFileName();
                        overlay.classList.add('hide');
                        progressText.textContent = `업로드 중... 0%`;
                        // showAlert("문서가 성공적으로 등록되었습니다."); // 너무 번거로워 생략
                    } catch(e) {
                        console.error(e);
                        // DB 저장 실패 시 Storage 파일 롤백(삭제)
                        try { await deleteObject(storageRef); } catch(err){}
                        overlay.classList.add('hide');
                        showAlert("문서 정보 저장에 실패했습니다.", "error");
                    }
                }
            );
        };

        // === 🔍 문서 뷰어 (PDF.js & Panzoom) ===
        window.openViewer = async (url, type) => {
            const overlay = document.getElementById('viewer-overlay');
            const contentDiv = document.getElementById('viewer-content');
            const loader = document.getElementById('viewer-loader');
            
            overlay.classList.add('active');
            contentDiv.innerHTML = '';
            contentDiv.appendChild(loader);
            loader.classList.remove('hide');
            
            if(panzoomInstance) { panzoomInstance.destroy(); panzoomInstance = null; }

            if (type === 'pdf') {
                try {
                    const loadingTask = pdfjsLib.getDocument(url);
                    const pdf = await loadingTask.promise;
                    const page = await pdf.getPage(1);
                    
                    const viewport = page.getViewport({ scale: 1 });
                    const scale = Math.min(contentDiv.clientWidth / viewport.width, contentDiv.clientHeight / viewport.height) * 0.95;
                    const scaledViewport = page.getViewport({ scale: scale });

                    const canvas = document.createElement('canvas');
                    canvas.className = "max-w-full max-h-full object-contain drop-shadow-2xl";
                    const context = canvas.getContext('2d');
                    canvas.height = scaledViewport.height;
                    canvas.width = scaledViewport.width;

                    const renderContext = { canvasContext: context, viewport: scaledViewport };
                    await page.render(renderContext).promise;
                    
                    contentDiv.appendChild(canvas);
                    // PDF도 Panzoom 적용
                    panzoomInstance = Panzoom(canvas, { maxScale: 4, minScale: 1, contain: 'outside' });
                    canvas.addEventListener('wheel', panzoomInstance.zoomWithWheel);
                } catch(e) {
                    console.error("PDF 렌더링 실패:", e);
                    contentDiv.innerHTML = '<p class="text-white text-center p-4">PDF를 불러올 수 없습니다.<br>네트워크 상태를 확인하세요.</p>';
                }
            } else {
                const img = document.createElement('img');
                img.src = url;
                img.className = "max-w-full max-h-full object-contain cursor-move";
                img.onload = () => {
                    loader.classList.add('hide');
                    panzoomInstance = Panzoom(img, { maxScale: 5, minScale: 1, contain: 'outside' });
                    img.parentElement.addEventListener('wheel', panzoomInstance.zoomWithWheel);
                };
                img.onerror = () => {
                    contentDiv.innerHTML = '<p class="text-white">이미지를 불러올 수 없습니다.</p>';
                };
                contentDiv.appendChild(img);
            }
            if(type === 'pdf') loader.classList.add('hide');
        };

        window.showAlert = (msg, type="info", showCancel=false) => {

                    okBtn.className = "flex-1 bg-red-600 text-white font-semibold py-3 rounded-xl hover:bg-red-700 active:scale-95 transition-all";
                } else {
                    icon.className = "w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-4 bg-blue-100 text-blue-500";
                    icon.innerHTML = '<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
                    okBtn.className = "flex-1 bg-blue-600 text-white font-semibold py-3 rounded-xl hover:bg-blue-700 active:scale-95 transition-all";
                }

                btnContainer.innerHTML = '';
                if(showCancel) {
                    const cancelBtn = document.createElement('button');
                    cancelBtn.className = "flex-1 bg-slate-100 text-slate-600 font-semibold py-3 rounded-xl hover:bg-slate-200 active:scale-95 transition-all";
                    cancelBtn.textContent = "취소";
                    cancelBtn.onclick = () => { closeAlert(); resolve(false); };
                    btnContainer.appendChild(cancelBtn);
                }
                okBtn.onclick = () => { closeAlert(); resolve(true); };
                btnContainer.appendChild(okBtn);

                document.getElementById('custom-alert').classList.add('active');
                alertCallback = resolve;
            });
        };
        window.showConfirm = (msg, isDanger=false) => showAlert(msg, isDanger ? 'error' : 'info', true);
        window.closeAlert = () => document.getElementById('custom-alert').classList.remove('active');

        window.showPrompt = (msg, defaultText="") => {
            return new Promise((resolve) => {
                document.getElementById('prompt-message').innerText = msg;
                const input = document.getElementById('prompt-input');
                input.value = defaultText;
                document.getElementById('custom-prompt').classList.add('active');
                setTimeout(() => input.focus(), 100);
                promptCallback = resolve;
                
                document.getElementById('prompt-submit-btn').onclick = () => closePrompt(input.value);
                input.onkeyup = (e) => { if(e.key === 'Enter') closePrompt(input.value); };
            });
        };
        window.closePrompt = (val) => {
            document.getElementById('custom-prompt').classList.remove('active');
            if(promptCallback) { promptCallback(val); promptCallback = null; }
        };
    </script>
</body>
</html>
