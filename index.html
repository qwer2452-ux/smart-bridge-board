<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Smart Bridge Board">

    <link rel="apple-touch-startup-image" href="/splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { brand: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 500: '#0ea5e9', 600: '#0284c7', 900: '#0c4a6e' } } }
            }
        };
    </script>

    <!-- QR Code Generator CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- PDF.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- Panzoom CDN -->
    <script src="https://unpkg.com/panzoom@9.4.0/dist/panzoom.min.js"></script>
    <!-- html2canvas CDN (고해상도 캡처) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- jsPDF CDN (PDF 저장용) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        body { -webkit-tap-highlight-color: transparent; user-select: none; overscroll-behavior-y: none; height: 100dvh; overflow: hidden; }
        input, select, textarea { user-select: auto; }
        .hide-view { display: none !important; }
        .pdf-canvas-wrapper canvas { max-width: 100%; height: auto; margin-bottom: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); border-radius: 8px; }
        /* 인쇄/저장은 화면 캡처(html2canvas) 방식이라 @media print 규칙이 필요 없습니다. */

</head>
<body class="bg-slate-900 flex justify-center text-slate-800 antialiased selection:bg-brand-200">

    <div class="w-full max-w-md bg-white h-[100dvh] shadow-2xl relative overflow-hidden flex flex-col">

        <!-- 로그인 화면 -->
        <div id="login-screen" class="flex-col h-full w-full absolute inset-0 bg-slate-50 z-30 hide-view justify-center items-center p-6">
            <div class="bg-white w-full max-w-sm rounded-3xl shadow-xl p-8 border border-slate-100">
                <div class="text-center mb-8">
                    <div class="bg-brand-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-brand-600">
                            <circle cx="12" cy="12" r="8"></circle>
                            <circle cx="12" cy="12" r="2"></circle>
                            <path d="M12 2v7.5"></path><path d="m19 5-5.23 5.23"></path><path d="M22 12h-7.5"></path>
                            <path d="m19 19-5.23-5.23"></path><path d="M12 14.5V22"></path><path d="M10.23 13.77 5 19"></path>
                            <path d="M9.5 12H2"></path><path d="M10.23 10.23 5 5"></path>
                        </svg>
                    </div>
                    <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Smart Bridge Board</h1>
                    <p class="text-brand-600 text-sm mt-2 font-bold">관리자 전용 로그인</p>
                </div>
                <form id="login-form" class="flex flex-col gap-4">
                    <input type="text" id="email" required autocomplete="username" class="w-full px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-brand-500 transition-all font-medium" placeholder="아이디 (예: komsa)">
                    <input type="password" id="password" required autocomplete="current-password" class="w-full px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-brand-500 transition-all font-medium" placeholder="비밀번호">
                    <button id="login-btn" type="submit" class="w-full bg-brand-600 text-white font-bold py-4 rounded-xl mt-2 hover:bg-brand-700 shadow-lg shadow-brand-200 transition-all active:scale-95">접속하기</button>
                </form>
            </div>
        </div>

        <!-- 관리자 홈 화면 (선박 목록) -->
        <div id="admin-home-mode" class="flex-col h-full w-full absolute inset-0 bg-slate-50 z-40 hide-view">
            <header class="bg-white border-b border-slate-200 text-slate-800 p-6 shadow-sm">
                <div class="flex items-center justify-between mb-1">
                    <h1 class="text-2xl font-black tracking-tight cursor-pointer hover:text-brand-600 transition-colors" onclick="window.location.reload()">내 선박 관리</h1>
                    <button id="logout-btn" class="text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg transition-colors border border-slate-200">로그아웃</button>
                </div>
                <p class="text-slate-500 text-sm font-medium">환영합니다! 관리할 선박을 선택하세요.</p>
            </header>
            <main class="flex-1 overflow-y-auto p-4">
                <div id="admin-ship-grid" class="grid grid-cols-2 gap-3"></div>
            </main>
        </div>

        <!-- 열람자 뷰어 화면 (QR 스캔 시 진입) -->
        <div id="viewer-mode" class="flex-col h-full w-full absolute inset-0 bg-slate-50 z-20 hide-view">
            <header class="bg-brand-900 text-white p-6 shadow-md rounded-b-2xl">
                <div class="flex items-center justify-between">
                    <div>
                        <h1 id="viewer-header-title" class="text-2xl font-bold tracking-tight line-clamp-1">로딩 중...</h1>
                        <p class="text-brand-100 text-sm mt-1">QR 선교 종합 게시판</p>
                    </div>
                </div>
            </header>
            <main class="flex-1 overflow-y-auto p-4">
                <div id="document-list" class="grid grid-cols-2 gap-3"></div>
            </main>
        </div>

        <!-- 관리자 대시보드 화면 -->
        <div id="admin-mode" class="flex-col h-full w-full absolute inset-0 bg-slate-50 z-50 hide-view">
            <header class="bg-white border-b border-slate-200 text-slate-800 p-4 shadow-sm flex items-center gap-2">
                <button id="admin-back-btn" class="text-slate-500 hover:text-brand-600 p-1.5 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" /></svg>
                </button>
                <h1 class="text-lg font-black cursor-pointer hover:text-brand-600 transition-colors" onclick="window.location.reload()">⚙️ 선박 관리 대시보드</h1>
            </header>

            <main class="flex-1 overflow-y-auto p-4 flex flex-col gap-6 pb-10">
                <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-3">
                    <label for="admin-ship-select" class="block text-sm font-extrabold text-brand-900">🚢 현재 관리 중인 선박</label>
                    <select id="admin-ship-select" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-800 outline-none focus:ring-2 focus:ring-brand-500"></select>

                    <!-- 선박 이미지 -->
                    <div class="flex flex-col gap-2 mt-1">
                        <span class="text-[11px] font-bold text-slate-400">선박 이미지 (선택)</span>
                        <div class="flex items-center gap-3">
                            <div id="ship-image-preview" class="w-16 h-16 rounded-xl bg-slate-100 border border-slate-200 flex items-center justify-center overflow-hidden shrink-0 text-3xl">🚢</div>
                            <input type="file" id="ship-image-input" accept=".pdf, image/*" class="flex-1 min-w-0 text-sm text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 cursor-pointer">
                        </div>
                        <button id="ship-image-delete-btn" data-action="delete-ship-image" class="hide-view bg-red-50 text-red-500 border border-red-100 hover:bg-red-100 font-bold py-1.5 rounded-lg text-xs transition-colors">이미지 삭제</button>
                    </div>

                    <div class="flex gap-2 mt-1">
                        <button data-action="edit-ship" class="flex-1 bg-slate-50 text-slate-600 hover:bg-slate-100 font-bold py-2 rounded-lg text-xs transition-colors">✏️ 이름 수정</button>
                        <button data-action="delete-ship" class="flex-1 bg-red-50 text-red-500 hover:bg-red-100 font-bold py-2 rounded-lg text-xs transition-colors">🗑️ 배 삭제</button>
                    </div>

                    <div class="border-t border-slate-100 pt-3 mt-1 flex flex-col gap-2">
                        <span class="text-[11px] font-bold text-slate-400">배포 및 접근 관리</span>
                        <button data-action="preview-board" class="w-full bg-slate-800 text-white font-bold py-2.5 rounded-lg text-xs transition-colors shadow flex items-center justify-center gap-1 mt-1"><span class="text-sm">👀</span> 종합 QR 게시판 미리보기</button>
                    </div>
                </section>

                <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-sm font-extrabold text-slate-800 mb-4 border-b border-slate-100 pb-2">📤 새 문서 등록</h2>
                    <form id="upload-form" class="flex flex-col gap-3">
                        <input type="text" id="doc-title" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm font-medium" placeholder="문서 제목 (예: 추가 매뉴얼)">
                        <textarea id="doc-desc" rows="2" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm font-medium resize-none" placeholder="문서 설명 (비워두면 자동으로 작성됩니다)"></textarea>
                        <input type="file" id="file-upload" class="w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 cursor-pointer" accept=".pdf, image/*" multiple required>
                        <p class="text-[10px] text-slate-400 font-medium px-1">최대 10개, 파일당 20MB 제한</p>
                        <button type="submit" id="upload-btn" class="w-full bg-slate-800 text-white font-bold py-3.5 rounded-xl hover:bg-slate-900 shadow-md mt-1">등록하기</button>
                    </form>
                </section>

                <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-6">
                    <h2 class="text-sm font-extrabold text-slate-800 mb-4 border-b border-slate-100 pb-2 flex items-center justify-between">
                        <span>📁 등록된 문서 관리</span>
                        <span id="doc-count-label" class="text-[11px] font-bold text-slate-400">최대 12개</span>
                    </h2>
                    <ul id="admin-doc-list" class="flex flex-col gap-2"></ul>
                </section>
            </main>
        </div>

        <!-- 단일/다중 문서 뷰어 모달 -->
        <div id="doc-viewer-mode" class="fixed inset-0 bg-slate-900 z-[100] flex flex-col transform translate-y-full transition-transform duration-300 max-w-md mx-auto">
            <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex justify-between items-center z-20 flex-shrink-0 relative">
                <h2 id="viewer-title" class="text-base font-bold text-white line-clamp-1">문서 로딩중</h2>
                <button id="doc-viewer-close" class="bg-slate-700 hover:bg-slate-600 text-white rounded-full w-8 h-8 flex items-center justify-center transition-colors"><span class="font-bold text-lg">&times;</span></button>
            </header>

            <main class="flex-1 bg-slate-900 overflow-y-auto relative p-2" id="viewer-scroll-area">
                <div id="viewer-content" class="w-full min-h-full flex flex-col items-center justify-center gap-4 pb-24"></div>
            </main>

            <div id="viewer-nav" class="absolute bottom-8 left-1/2 -translate-x-1/2 bg-slate-800/95 text-white rounded-full flex items-center shadow-[0_10px_40px_rgba(0,0,0,0.5)] border border-slate-600 backdrop-blur-md z-30 transition-opacity duration-300 hidden">
                <button id="viewer-prev" class="px-5 py-3 font-bold hover:text-brand-400 active:scale-95 disabled:opacity-30 disabled:active:scale-100 transition-all rounded-l-full">&lt;</button>
                <span id="viewer-page-text" class="text-sm font-bold min-w-[4rem] text-center pointer-events-none">1 / 5</span>
                <button id="viewer-next" class="px-5 py-3 font-bold hover:text-brand-400 active:scale-95 disabled:opacity-30 disabled:active:scale-100 transition-all rounded-r-full">&gt;</button>
            </div>
        </div>

        <!-- 커스텀 알림 프롬프트 -->
        <div id="custom-prompt-modal" class="fixed inset-0 bg-black/60 z-[200] hidden items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center">
                <h3 id="custom-prompt-msg" class="text-lg font-bold text-slate-800 mb-4 whitespace-pre-line">알림</h3>
                <input type="text" id="custom-prompt-input" class="w-full px-4 py-3 border border-slate-300 rounded-xl mb-5 outline-none focus:ring-2 focus:ring-brand-500 text-center font-medium">
                <div class="flex justify-center gap-3">
                    <button id="custom-prompt-cancel" data-prompt-close="false" class="w-1/2 py-3.5 bg-slate-100 text-slate-700 rounded-xl font-bold">취소</button>
                    <button data-prompt-close="true" class="w-1/2 py-3.5 bg-brand-600 text-white rounded-xl font-bold shadow-md">확인</button>
                </div>
            </div>
        </div>

        <!-- 파일 수정(이미지 개별 관리) 모달 -->
        <div id="doc-edit-modal" class="fixed inset-0 bg-black/60 z-[115] hidden items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl max-h-[85vh] flex flex-col">
                <div class="flex items-center justify-between mb-1">
                    <h3 class="text-base font-extrabold text-slate-800">🖼️ 이미지 관리</h3>
                    <button data-action="close-doc-edit" class="bg-slate-100 hover:bg-slate-200 rounded-full w-8 h-8 flex items-center justify-center text-slate-500 font-bold text-lg">&times;</button>
                </div>
                <p id="doc-edit-title" class="text-sm font-bold text-brand-600 mb-3 truncate"></p>
                <div id="doc-edit-grid" class="grid grid-cols-3 gap-2 overflow-y-auto flex-1 mb-4 min-h-[80px]"></div>
                <div class="border-t border-slate-100 pt-4 flex flex-col gap-2">
                    <span class="text-[11px] font-bold text-slate-400">이미지/PDF 추가</span>
                    <input type="file" id="doc-edit-file" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 cursor-pointer" accept=".pdf, image/*" multiple>
                    <button data-action="add-doc-files" id="doc-edit-add-btn" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 rounded-xl text-sm shadow-md">선택한 파일 추가</button>
                    <button data-action="close-doc-edit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-xl text-sm shadow-md mt-1">완료</button>
                </div>
            </div>
        </div>

        <!-- 종합 QR 게시판 (인쇄/JPG/PDF 캡처 전용) -->
        <div id="qr-board-mode" class="hidden fixed inset-0 z-[130] bg-slate-300">
            <!-- 상단 툴바 -->
            <div class="no-print absolute top-0 left-0 right-0 h-[52px] z-50 flex items-center justify-between gap-1 bg-slate-800 text-white px-3 shadow">
                <div class="flex gap-1 items-center">
                    <button data-action="zoom-out" class="bg-slate-600 hover:bg-slate-500 text-white text-lg font-bold w-8 h-8 rounded-lg leading-none">－</button>
                    <button data-action="zoom-in" class="bg-slate-600 hover:bg-slate-500 text-white text-lg font-bold w-8 h-8 rounded-lg leading-none">＋</button>
                    <button data-action="zoom-fit" class="bg-slate-600 hover:bg-slate-500 text-white text-xs font-bold px-2 h-8 rounded-lg">맞춤</button>
                </div>
                <div class="flex gap-1 items-center">
                    <button data-action="download-jpg" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-2.5 h-8 rounded-lg shadow">💾 JPG</button>
                    <button data-action="download-pdf" class="bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold px-2.5 h-8 rounded-lg shadow">📄 PDF</button>
                    <button data-action="close-board" class="bg-slate-600 hover:bg-slate-500 text-white text-xs font-bold px-2.5 h-8 rounded-lg">닫기</button>
                </div>
            </div>

            <!-- 팬/줌 뷰포트 (두 손가락으로 확대·축소·이동) -->
            <div class="board-scroll-container absolute top-[52px] left-0 right-0 bottom-0 overflow-hidden touch-none">

                <!-- 고정 사이즈 포스터 영역 (A4 세로 비율: 842 x 1190) -->
                <div id="capture-board" class="w-[842px] h-[1190px] absolute left-0 top-0 bg-white border-[4px] border-[#1e56b3] rounded-[2.5rem] flex flex-col p-8 overflow-hidden box-border shadow-2xl">

                    <!-- 헤더: 로고 · 타이틀 · 마스코트 (src는 JS에서 토큰 포함 주소로 주입) -->
                    <div class="flex items-center justify-between z-10 relative px-1 shrink-0">
                        <img id="board-logo" alt="" class="w-[95px] h-[95px] object-contain shrink-0" crossorigin="anonymous">

                        <h1 class="text-[42px] font-black text-[#003399] tracking-tight text-center whitespace-nowrap" style="font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; line-height: 1.35; padding-top: 4px; padding-bottom: 12px;">조타실 QR 자료 게시판</h1>

                        <img id="board-mascot-top" alt="" class="w-[95px] h-[95px] object-contain shrink-0" crossorigin="anonymous">
                    </div>

                    <!-- 중앙: 게시물 표 (게시물 종류 | 설명 | QR코드) -->
                    <div id="qr-board-table" class="flex-1 min-h-0 mt-1 mb-3 z-10 relative">
                        <!-- JS에서 주입 -->
                    </div>

                    <!-- 푸터: 스마트폰 안내문 -->
                    <div class="flex items-center justify-center gap-4 z-10 relative mb-2 shrink-0">
                        <!-- 예쁜 스마트폰 아이콘 (SVG) -->
                        <svg width="42" height="68" viewBox="0 0 64 104" fill="none" xmlns="http://www.w3.org/2000/svg" class="shrink-0 drop-shadow-sm">
                            <rect x="2" y="2" width="60" height="100" rx="16" fill="#003399"/>
                            <rect x="8" y="13" width="48" height="78" rx="5" fill="#ffffff"/>
                            <rect x="25" y="7" width="14" height="3" rx="1.5" fill="#ffffff"/>
                            <rect x="26" y="95" width="12" height="4" rx="2" fill="#ffffff"/>
                        </svg>
                        <span class="text-[36px] font-black text-[#003399]" style="font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; line-height: 1.4; padding-top: 3px; padding-bottom: 12px;">휴대폰으로 스캔하여 열람</span>
                    </div>

                    <!-- 우측 하단 선박 마스코트 (z-index를 표보다 뒤로 → QR 절대 안 가림) -->
                    <img id="board-mascot-ship" alt="" class="absolute bottom-[4px] right-[6px] w-[100px] h-[100px] object-contain z-[5]" crossorigin="anonymous">

                    <!-- 하단 물결 무늬 (html2canvas 호환 위해 img data-URI 사용) -->
                    <img id="board-wave" class="absolute bottom-0 left-0 w-full h-[80px] z-0 rounded-b-[2.1rem]" alt="" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 80' preserveAspectRatio='none'><path d='M0,40 C150,10 300,70 450,40 C600,10 750,70 900,40 C1050,10 1200,60 1200,45 L1200,80 L0,80 Z' fill='%23bfdbfe'/><path d='M0,50 C150,25 300,75 450,50 C600,25 750,75 900,50 C1050,25 1200,65 1200,55 L1200,80 L0,80 Z' fill='%233b82f6' opacity='0.6'/></svg>">
                </div>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp, query, where, getDocs, updateDoc, getDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAo7hgaaj4NedahYZFEQfZqbIVi596A_XQ",
            authDomain: "smart-bridge-board.firebaseapp.com",
            projectId: "smart-bridge-board",
            storageBucket: "smart-bridge-board.firebasestorage.app",
            messagingSenderId: "81406484031",
            appId: "1:81406484031:web:68bb7580e46b1d5348628a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        window['pdfjs-dist/build/pdf'].GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const state = {
            documents: [],
            ships: [],
            viewerShipId: null,
            autoOpenDocId: null,
            editingDocId: null,
            qrInstance: null,
            panzooms: [],
            unsub: { ships: null, docs: null },
            viewerFiles: [],
            viewerIndex: 0
        };

        const $ = (id) => document.getElementById(id);
        const SCREENS = ['login-screen', 'viewer-mode', 'admin-home-mode', 'admin-mode'];
        const hide = (id) => { const el = $(id); el.classList.add('hide-view'); el.classList.remove('flex'); };
        const show = (id) => { const el = $(id); el.classList.remove('hide-view'); el.classList.add('flex'); };
        const showScreen = (id) => { SCREENS.forEach(hide); show(id); };

        // 하단 물결을 PNG로 변환해 두면 JPG/PDF 캡처(html2canvas)에서도 확실히 렌더링됨
        (function prepareWave() {
            const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='80' viewBox='0 0 1200 80' preserveAspectRatio='none'><path d='M0,40 C150,10 300,70 450,40 C600,10 750,70 900,40 C1050,10 1200,60 1200,45 L1200,80 L0,80 Z' fill='#bfdbfe'/><path d='M0,50 C150,25 300,75 450,50 C600,25 750,75 900,50 C1050,25 1200,65 1200,55 L1200,80 L0,80 Z' fill='#3b82f6' opacity='0.6'/></svg>`;
            const im = new Image();
            im.onload = () => {
                try {
                    const c = document.createElement('canvas');
                    c.width = 1200; c.height = 80;
                    c.getContext('2d').drawImage(im, 0, 0, 1200, 80);
                    const el = $('board-wave');
                    if (el) el.src = c.toDataURL('image/png');
                } catch (_) {}
            };
            im.src = 'data:image/svg+xml;base64,' + btoa(svg);
        })();

        let promptCallback = null;
        const showPrompt = (msg, defaultVal, isAlertOnly, callback) => {
            $('custom-prompt-msg').innerText = msg;
            const input = $('custom-prompt-input');
            const cancelBtn = $('custom-prompt-cancel');

            input.style.display = isAlertOnly ? 'none' : 'block';
            cancelBtn.style.display = isAlertOnly ? 'none' : 'block';
            if (!isAlertOnly) input.value = defaultVal || '';

            const modal = $('custom-prompt-modal');
            modal.classList.remove('hidden'); modal.classList.add('flex');
            if (!isAlertOnly) setTimeout(() => input.focus(), 100);
            promptCallback = callback;
        };
        const closeCustomPrompt = (isOk) => {
            const modal = $('custom-prompt-modal');
            modal.classList.add('hidden'); modal.classList.remove('flex');
            const cb = promptCallback;
            promptCallback = null;
            if (cb) cb(isOk ? $('custom-prompt-input').value : null);
        };
        const showAlert = (msg, cb) => showPrompt(msg, "", true, cb);

        // 입력 없이 [취소]/[확인]만 있는 간단 확인창 → callback(true/false)
        const showConfirm = (msg, callback) => {
            $('custom-prompt-msg').innerText = msg;
            $('custom-prompt-input').style.display = 'none';
            $('custom-prompt-cancel').style.display = 'block';
            const modal = $('custom-prompt-modal');
            modal.classList.remove('hidden'); modal.classList.add('flex');
            promptCallback = (val) => callback(val !== null);
        };

        document.querySelectorAll('[data-prompt-close]').forEach(btn => {
            btn.addEventListener('click', () => closeCustomPrompt(btn.dataset.promptClose === 'true'));
        });
        $('custom-prompt-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); closeCustomPrompt(true); }
        });

        // ── 자동 종료/로그아웃 타이머 ────────────────────────────────
        const VIEWER_TIMEOUT_MS = 5 * 60 * 1000;   // QR 열람자: 5분
        const ADMIN_TIMEOUT_MS = 60 * 60 * 1000;   // 관리자: 1시간
        let viewerTimeoutId = null;
        let adminTimeoutId = null;
        const clearAutoTimers = () => {
            clearTimeout(viewerTimeoutId); viewerTimeoutId = null;
            clearTimeout(adminTimeoutId); adminTimeoutId = null;
        };
        const startViewerTimeout = () => {
            clearTimeout(viewerTimeoutId);
            viewerTimeoutId = setTimeout(expireViewer, VIEWER_TIMEOUT_MS);
        };
        const startAdminTimeout = () => {
            clearTimeout(adminTimeoutId);
            adminTimeoutId = setTimeout(() => {
                closeQrBoard(); closeDocEdit(); closeDocViewer();
                signOut(auth);
                showAlert("보안을 위해 1시간이 지나 자동 로그아웃되었습니다.\n다시 로그인해 주세요.");
            }, ADMIN_TIMEOUT_MS);
        };
        function expireViewer() {
            closeDocViewer();
            if (state.unsub.docs) { state.unsub.docs(); state.unsub.docs = null; }
            try { window.history.replaceState({}, document.title, window.location.pathname); } catch (_) {}
            $('viewer-header-title').textContent = "열람 시간 만료";
            $('document-list').innerHTML = `
                <div class="col-span-2 flex flex-col items-center justify-center text-center py-20 bg-white rounded-2xl border border-slate-100 shadow-sm">
                    <span class="text-5xl mb-4">⏱️</span>
                    <p class="font-bold text-slate-700 mb-1">열람 시간이 만료되었습니다</p>
                    <p class="text-xs text-slate-400 leading-relaxed">보안을 위해 5분 후 자동으로 종료됩니다.<br>다시 보려면 QR 코드를 다시 스캔해 주세요.</p>
                </div>`;
        }

        onAuthStateChanged(auth, async (user) => {
            if (state.unsub.ships) { state.unsub.ships(); state.unsub.ships = null; }
            if (state.unsub.docs) { state.unsub.docs(); state.unsub.docs = null; }
            clearAutoTimers();

            const shipIdParam = new URLSearchParams(window.location.search).get('ship');

            if (shipIdParam) {
                await enterViewerMode(shipIdParam, user);
            } else if (user) {
                enterAdminMode(user);
            } else {
                showScreen('login-screen');
            }
        });

        const getTimestamp = (t) => t ? (typeof t.toMillis === 'function' ? t.toMillis() : 0) : 0;
        const sortByCreatedDesc = (arr) => arr.sort((a, b) => getTimestamp(b.createdAt) - getTimestamp(a.createdAt));

        // 문서 정렬: order(작을수록 위) 우선, order 없으면 생성시간(최신 우선)
        const docSort = (a, b) => {
            const oa = (typeof a.order === 'number') ? a.order : Number.MAX_SAFE_INTEGER;
            const ob = (typeof b.order === 'number') ? b.order : Number.MAX_SAFE_INTEGER;
            if (oa !== ob) return oa - ob;
            return getTimestamp(b.createdAt) - getTimestamp(a.createdAt);
        };

        async function enterViewerMode(shipId, user) {
            state.viewerShipId = shipId;
            state.autoOpenDocId = new URLSearchParams(window.location.search).get('doc') || null;
            showScreen('viewer-mode');
            startViewerTimeout(); // 5분 후 자동 종료

            try {
                const shipSnap = await getDoc(doc(db, "ships", shipId));
                $('viewer-header-title').textContent = shipSnap.exists()
                    ? shipSnap.data().shipName
                    : "존재하지 않는 선박입니다";
            } catch (e) {
                $('viewer-header-title').textContent = "연결 오류";
            }

            const qDocs = query(collection(db, "bulletins"), where("shipId", "==", shipId));
            state.unsub.docs = onSnapshot(qDocs, (snapshot) => {
                state.documents = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                state.documents.sort(docSort);
                renderDocuments();
                maybeAutoOpenDoc();
            });
        }

        function maybeAutoOpenDoc() {
            if (!state.autoOpenDocId) return;
            const target = state.documents.find(d => d.id === state.autoOpenDocId);
            if (target) {
                openDocViewer(target.title, Array.isArray(target.files) ? target.files : []);
                state.autoOpenDocId = null;
            }
        }

        function enterAdminMode(user) {
            showScreen('admin-home-mode');
            startAdminTimeout(); // 1시간 후 자동 로그아웃
            $('email').value = ''; $('password').value = '';

            const qShips = query(collection(db, "ships"), where("ownerId", "==", user.uid));
            state.unsub.ships = onSnapshot(qShips, (snapshot) => {
                state.ships = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                sortByCreatedDesc(state.ships);
                updateShipSelectOptions();
                renderAdminHome();
                renderShipImagePreview();
            });

            const qDocs = query(collection(db, "bulletins"), where("ownerId", "==", user.uid));
            state.unsub.docs = onSnapshot(qDocs, (snapshot) => {
                state.documents = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                state.documents.sort(docSort);
                renderDocuments();
                renderAdminHome();
                refreshDocEditIfOpen();
            });
        }

        $('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = $('login-btn');
            const orig = btn.innerText;
            btn.innerText = "확인 중..."; btn.disabled = true;
            try {
                // 아이디만 입력하면 고정 도메인을 붙여 로그인 (이메일 전체 입력도 그대로 동작)
                const raw = $('email').value.trim();
                const loginEmail = raw.includes('@') ? raw : raw + '@smartbridge.app';
                await signInWithEmailAndPassword(auth, loginEmail, $('password').value);
                try { window.history.replaceState({}, document.title, window.location.pathname); } catch (_) {}
            } catch (error) {
                showAlert("아이디 또는 비밀번호가 올바르지 않습니다.");
            } finally {
                btn.innerText = orig; btn.disabled = false;
            }
        });
        $('logout-btn').addEventListener('click', () => signOut(auth));

        const goToAdminDashboard = (shipId) => {
            hide('admin-home-mode'); show('admin-mode');
            updateShipSelectOptions(shipId);
            renderShipImagePreview();
            renderDocuments();
        };
        const goBackToAdminHome = () => { hide('admin-mode'); show('admin-home-mode'); renderAdminHome(); };
        $('admin-back-btn').addEventListener('click', goBackToAdminHome);

        const updateShipSelectOptions = (selectedShipId = null) => {
            const selectEl = $('admin-ship-select');
            const currentVal = selectedShipId || selectEl.value;

            selectEl.innerHTML = '';
            if (state.ships.length === 0) {
                selectEl.innerHTML = '<option value="">등록된 선박이 없습니다</option>';
                return;
            }
            let found = false;
            state.ships.forEach(shipObj => {
                const opt = document.createElement('option');
                opt.value = shipObj.id;
                opt.textContent = shipObj.shipName;
                if (shipObj.id === currentVal) { opt.selected = true; found = true; }
                selectEl.appendChild(opt);
            });
            if (!found && selectEl.options.length > 0) selectEl.options[0].selected = true;
        };
        $('admin-ship-select').addEventListener('change', () => { renderShipImagePreview(); renderDocuments(); });

        const addNewShip = () => {
            showPrompt("추가할 선박 이름을 입력하세요", "", false, async (shipName) => {
                if (shipName && shipName.trim()) {
                    try {
                        const shipRef = await addDoc(collection(db, "ships"), {
                            shipName: shipName.trim(),
                            ownerId: auth.currentUser.uid,
                            createdAt: serverTimestamp()
                        });

                        const defaultDocs = ["임명장", "회사방침", "당직배치도", "선박제원", "항로도", "비품현황", "승무원 근무표", "승무원 면허 및 교육 유효기간"];
                        const baseTime = Date.now();

                        const batchPromises = defaultDocs.map((title, idx) => {
                            return addDoc(collection(db, "bulletins"), {
                                title: title,
                                files: [],
                                filePaths: [],
                                shipId: shipRef.id,
                                ownerId: auth.currentUser.uid,
                                order: idx,
                                createdAt: Timestamp.fromMillis(baseTime - (idx * 1000))
                            });
                        });

                        await Promise.all(batchPromises);
                        showAlert(`'${shipName.trim()}' 선박과 필수 서류함이 성공적으로 생성되었습니다.`);
                    } catch (error) {
                        showAlert("선박 추가 실패: " + error.message);
                    }
                }
            });
        };

        const editCurrentShip = () => {
            const shipId = $('admin-ship-select').value;
            const shipObj = state.ships.find(s => s.id === shipId);
            if (!shipObj) return showAlert("선택된 선박이 없습니다.");
            showPrompt("새 이름 입력:", shipObj.shipName, false, async (newName) => {
                if (newName && newName.trim() && newName.trim() !== shipObj.shipName) {
                    await updateDoc(doc(db, "ships", shipId), { shipName: newName.trim() });
                }
            });
        };

        // ── 선박 이미지 (등록/변경/삭제/미리보기) ─────────────────────
        const renderShipImagePreview = () => {
            const box = $('ship-image-preview');
            const delBtn = $('ship-image-delete-btn');
            if (!box) return;
            const ship = state.ships.find(s => s.id === $('admin-ship-select').value);
            if (ship?.shipImageUrl) {
                box.innerHTML = `<img src="${ship.shipImageUrl}" class="w-full h-full object-cover" alt="">`;
                delBtn?.classList.remove('hide-view');
            } else {
                box.innerHTML = '🚢';
                delBtn?.classList.add('hide-view');
            }
        };

        // 이미지를 최대 maxDim(px)로 리사이즈 + JPEG 압축 → 용량 대폭 감소
        const resizeImage = (file, maxDim, quality) => new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
                let { width, height } = img;
                if (width >= height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
                else if (height > width && height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
                const canvas = document.createElement('canvas');
                canvas.width = width; canvas.height = height;
                canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                URL.revokeObjectURL(img.src);
                canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error("이미지 변환 실패")), 'image/jpeg', quality);
            };
            img.onerror = () => { URL.revokeObjectURL(img.src); reject(new Error("이미지를 읽을 수 없습니다.")); };
            img.src = URL.createObjectURL(file);
        });

        const handleShipImageUpload = async (file) => {
            const shipId = $('admin-ship-select').value;
            const ship = state.ships.find(s => s.id === shipId);
            if (!ship) return showAlert("선박을 먼저 선택해주세요.");
            if (!file.type.startsWith('image/')) return showAlert("이미지 파일만 등록할 수 있습니다.");

            const box = $('ship-image-preview');
            if (box) box.innerHTML = `<span class="animate-spin text-xl">⏳</span>`;

            try {
                const blob = await resizeImage(file, 600, 0.8); // 최대 600px, JPEG 80% 압축
                const filePath = `bulletins/${auth.currentUser.uid}/ship_${shipId}_${Date.now()}.jpg`;
                const uploadTask = uploadBytesResumable(ref(storage, filePath), blob, { contentType: 'image/jpeg' });
                await new Promise((resolve, reject) => uploadTask.on('state_changed', null, reject, resolve));
                const url = await getDownloadURL(uploadTask.snapshot.ref);
                const oldPath = ship.shipImagePath;
                await updateDoc(doc(db, "ships", shipId), { shipImageUrl: url, shipImagePath: filePath });
                if (oldPath) { try { await deleteObject(ref(storage, oldPath)); } catch (_) {} }
            } catch (e) {
                renderShipImagePreview(); // 실패 시 미리보기 원복
                showAlert("이미지 등록 실패: " + e.message);
            }
        };

        const deleteShipImage = () => {
            const shipId = $('admin-ship-select').value;
            const ship = state.ships.find(s => s.id === shipId);
            if (!ship || !ship.shipImageUrl) return;
            showConfirm("선박 이미지를 삭제할까요?", async (ok) => {
                if (!ok) return;
                const oldPath = ship.shipImagePath;
                try {
                    await updateDoc(doc(db, "ships", shipId), { shipImageUrl: null, shipImagePath: null });
                    if (oldPath) { try { await deleteObject(ref(storage, oldPath)); } catch (_) {} }
                } catch (e) {
                    showAlert("삭제 실패: " + e.message);
                }
            });
        };

        $('ship-image-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleShipImageUpload(file);
            e.target.value = '';
        });

        const deleteCurrentShip = () => {
            const shipId = $('admin-ship-select').value;
            const shipObj = state.ships.find(s => s.id === shipId);
            if (!shipObj) return;
            showPrompt(`'${shipObj.shipName}' 삭제 시 '삭제' 입력\n(모든 문서도 함께 영구 삭제됩니다)`, "", false, async (res) => {
                if (res !== '삭제') return;
                try {
                    const q = query(
                        collection(db, "bulletins"),
                        where("shipId", "==", shipId),
                        where("ownerId", "==", auth.currentUser.uid)
                    );
                    const snaps = await getDocs(q);
                    await Promise.all(snaps.docs.map(async (d) => {
                        await deleteStorageFiles(d.data().filePaths);
                        await deleteDoc(doc(db, "bulletins", d.id));
                    }));
                    await deleteDoc(doc(db, "ships", shipId));
                    goBackToAdminHome();
                } catch (error) {
                    showAlert("선박 삭제 중 오류가 발생했습니다: " + error.message);
                }
            });
        };

        const deleteStorageFiles = async (filePaths) => {
            if (!Array.isArray(filePaths)) return;
            await Promise.all(filePaths.map(async (path) => {
                try { await deleteObject(ref(storage, path)); } catch (_) {}
            }));
        };

        /* QR에 넣을 문서 주소.
         * 배포된 사이트(http/https)에서는 지금 주소를 그대로 사용한다.
         * 로컬 파일(file:)이나 미리보기(data:)로 열면 location.pathname 이 HTML 소스 전체가 되어
         * QR에 담을 수 없을 만큼 길어지므로, 그때만 실제 배포 주소를 사용한다. (배포 환경에는 영향 없음)
         */
        const APP_BASE_URL = 'https://smart-bridge-board.vercel.app/';
        const shareBase = () => /^https?:$/.test(window.location.protocol)
            ? window.location.origin + window.location.pathname
            : APP_BASE_URL;
        // 개별 문서 바로 열기
        const getDocShareUrl = (shipId, docId) => shareBase() + `?ship=${shipId}&doc=${docId}`;
        // 선박의 전체 자료 목록(폴더식 열람 화면) 열기 — doc 파라미터 없음
        const getShipShareUrl = (shipId) => shareBase() + `?ship=${shipId}`;

        const generateQrDataUrl = (text) => new Promise((resolve, reject) => {
            const tmp = document.createElement('div');
            tmp.style.position = 'fixed'; tmp.style.left = '-9999px';
            document.body.appendChild(tmp);
            new QRCode(tmp, { text, width: 300, height: 300, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });
            const deadline = Date.now() + 8000; // 무한 대기 방지
            const pick = () => {
                const url = tmp.querySelector('img')?.src || tmp.querySelector('canvas')?.toDataURL('image/png');
                if (url && url.startsWith('data:image')) { tmp.remove(); resolve(url); }
                else if (Date.now() > deadline) { tmp.remove(); reject(new Error('QR 생성 시간 초과')); }
                else setTimeout(pick, 30);
            };
            pick();
        });

        /* ── 공단 브랜딩 이미지 로드 ─────────────────────────────────────
         * 하드코딩 URL(?alt=media, 토큰 없음) 대신 SDK getDownloadURL 로 토큰 포함 주소를 받아 주입.
         * ※ Storage 파일명이 정확해야 하고, Storage 보안 규칙에서 읽기가 허용돼야 합니다.
         *   (가장 확실한 방법은 이 3개 PNG를 GitHub 저장소에 넣고 아래 경로를 './logo.png' 처럼 상대경로로 바꾸는 것)
         */
        const BRANDING_PATHS = {
            'board-logo': 'KOMSA-원형01_배경투명.png',
            'board-mascot-top': '투명.png',
            'board-mascot-ship': '투명1.png'
        };
        let brandingCache = {};
        const loadBrandingImages = async () => {
            await Promise.all(Object.entries(BRANDING_PATHS).map(async ([elId, path]) => {
                const el = $(elId);
                if (!el) return;
                try {
                    if (!brandingCache[elId]) {
                        brandingCache[elId] = await getDownloadURL(ref(storage, path));
                    }
                    await new Promise((resolve) => {
                        el.onload = () => resolve();
                        el.onerror = () => { el.style.visibility = 'hidden'; resolve(); };
                        el.src = brandingCache[elId];
                    });
                    el.style.visibility = 'visible';
                } catch (e) {
                    console.error('브랜딩 이미지 로드 실패 →', path, e);
                    el.style.visibility = 'hidden'; // 로고 없이도 나머지는 정상 캡처
                }
            }));
        };

        // ── 게시판 팬/줌 (모바일 두 손가락 확대·축소·이동) ──────────
        let boardPz = null;
        const disposeBoardPan = () => { if (boardPz) { try { boardPz.dispose(); } catch (_) {} boardPz = null; } };
        const fitBoard = () => {
            const container = document.querySelector('.board-scroll-container');
            if (!boardPz || !container) return;
            const cw = container.clientWidth, ch = container.clientHeight;
            const boardEl = $('capture-board');                        // A4 세로(842×1190) — 실제 크기를 읽어 사용
            const bw = boardEl.offsetWidth || 842, bh = boardEl.offsetHeight || 1190;
            const scale = Math.min(cw / bw, ch / bh) * 0.96;
            boardPz.zoomAbs(0, 0, scale);
            boardPz.moveTo((cw - bw * scale) / 2, (ch - bh * scale) / 2);
        };
        const initBoardPan = () => {
            disposeBoardPan();
            const board = $('capture-board');
            board.style.transform = '';
            boardPz = panzoom(board, { maxZoom: 5, minZoom: 0.1, bounds: false, zoomDoubleClickSpeed: 1 });
            requestAnimationFrame(() => fitBoard());
        };
        const zoomBoard = (ratio) => {
            const container = document.querySelector('.board-scroll-container');
            if (!boardPz || !container) return;
            const r = container.getBoundingClientRect();
            boardPz.smoothZoom(r.left + r.width / 2, r.top + r.height / 2, ratio);
        };
        window.addEventListener('resize', () => {
            if (boardPz && !$('qr-board-mode').classList.contains('hidden')) fitBoard();
        });

        // HTML 특수문자 이스케이프 (표에 문서명/설명을 안전하게 주입)
        const esc = (s = '') => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        /* ── 문서 설명 자동 생성 ────────────────────────────────────────
         * 사용자가 설명을 비워두면 문서 이름에 맞는 설명을 자동으로 작성한다.
         * 1) 내장 사전(표준 게시물) → 2) 키워드 규칙 → 3) 기본 문구
         * ※ 위에서부터 먼저 일치하는 항목이 쓰이므로 구체적인 항목을 앞에 둔다.
         */
        const DESC_DICT = [
            [['임명장', '임명'], '선장 및 주요 직책자의 임명 사항을 확인할 수 있는 임명장입니다.'],
            [['안전관리목표', '목표및방침'], '선사의 안전관리 목표와 경영 방침을 안내하는 자료입니다.'],
            [['복무지침', '선장복무'], '선장이 준수해야 할 복무 기준과 직무 수행 지침입니다.'],
            [['근무편성', '편성표', '근무표'], '승무원의 월간 근무 일정과 당직 편성을 정리한 표입니다.'],
            [['운항관리자', '휴무'], '운항관리자의 휴무 일정을 안내하는 자료입니다.'],
            [['법정장비', '증서목록', '증서'], '선박에 비치된 법정장비와 각종 증서의 목록입니다.'],
            [['유효기간', '만료일'], '승무원의 해기사 면허와 교육 이수의 유효기간을 확인할 수 있는 자료입니다.'],
            [['면허', '교육'], '승무원의 해기사 면허 및 교육 이수 현황을 확인할 수 있는 자료입니다.'],
            [['항로도', '항로'], '선박의 운항 항로를 표시한 도면입니다.'],
            [['회사방침', '방침'], '선사의 안전경영 방침을 안내하는 자료입니다.'],
            [['당직배치', '당직'], '당직 근무자의 배치 현황을 나타낸 배치도입니다.'],
            [['선원명부', '명부'], '승선 중인 선원의 인적사항을 정리한 명부입니다.'],
            [['선박제원', '제원'], '선박의 주요 제원과 성능 정보를 정리한 자료입니다.'],
            [['비상조직', '조직표'], '비상 상황 시 임무와 조직 체계를 나타낸 조직표입니다.'],
            [['비품'], '선내 비치 비품의 보유 현황을 정리한 자료입니다.'],
            [['비상', '대응', '절차'], '비상 상황 발생 시 대응 절차를 안내하는 자료입니다.'],
            [['점검'], '점검 항목과 점검 결과를 확인할 수 있는 자료입니다.'],
            [['매뉴얼', '지침'], '업무 수행에 필요한 기준과 절차를 정리한 자료입니다.']
        ];

        const autoDescribe = (title = '') => {
            const t = String(title || '').trim();
            if (!t) return '관련 자료입니다.';
            const key = t.replace(/\s+/g, '');

            for (const [keys, desc] of DESC_DICT) {
                if (keys.some(k => key.includes(k))) return desc;
            }
            // 이름 끝 글자로 문서 성격 추정
            if (/표$/.test(t)) return `${t}의 내용을 정리한 표입니다.`;
            if (/도$/.test(t)) return `${t}의 내용을 나타낸 도면입니다.`;
            if (/(서|증)$/.test(t)) return `${t}의 내용을 확인할 수 있는 문서입니다.`;
            if (/(목록|현황)$/.test(t)) return `${t}을 정리한 자료입니다.`;
            return `${t} 관련 자료입니다.`;
        };

        // 🌟 종합 QR 게시판 열기 (미리보기)
        const openQrBoard = async () => {
            const shipId = $('admin-ship-select').value;
            const shipObj = state.ships.find(s => s.id === shipId);
            if (!shipObj) return showAlert("선박을 먼저 선택해주세요.");

            const docs = state.documents.filter(d => d.shipId === shipId);
            const wrap = $('qr-board-table');

            $('qr-board-mode').classList.remove('hidden');
            loadBrandingImages(); // 로고/마스코트 주입 (비동기)
            wrap.innerHTML = `<div class="text-center py-20 text-[#003399] font-bold text-3xl">QR 생성 중... 잠시만 기다려주세요.</div>`;
            initBoardPan(); // 로딩 중에도 게시판이 화면에 맞게 보이도록 먼저 맞춤

            let rowsData;
            try {
                // 맨 윗줄 고정 행: QR 하나로 전체 자료 목록(폴더식 화면)을 여는 링크
                const allRow = {
                    title: '전체 자료 보기',
                    desc: '이 QR 하나로 아래 모든 자료를 한 번에 열람할 수 있습니다.',
                    qr: await generateQrDataUrl(getShipShareUrl(shipId)),
                    isAll: true
                };
                const docRows = await Promise.all(docs.map(async (d) => ({
                    title: d.title || '',
                    desc: (d.description && d.description.trim()) ? d.description.trim() : autoDescribe(d.title),
                    qr: await generateQrDataUrl(getDocShareUrl(shipId, d.id)),
                    isAll: false
                })));
                rowsData = [allRow, ...docRows];
            } catch (e) {
                console.error('QR 생성 실패:', e);
                wrap.innerHTML = `<div class="text-center py-20 text-red-600 font-bold text-2xl">QR 생성에 실패했습니다.<br>인터넷 연결을 확인한 뒤 다시 시도해주세요.</div>`;
                initBoardPan();
                return;
            }

            // 표 영역 높이에 맞춰 행 높이·QR 크기·글씨 크기를 자동 배분
            const n = rowsData.length;
            const areaH = wrap.clientHeight || 920;
            const headH = 54;
            const rowH = Math.floor((areaH - headH) / n);
            const qrSize = Math.max(56, Math.min(150, rowH - 14));
            const titleFs = Math.max(14, Math.min(24, Math.round(rowH * 0.24)));
            const descFs = Math.max(12, Math.min(19, Math.round(rowH * 0.19)));

            const NAVY = '#003399', LINE = '#1e56b3';
            const FONT = "'Malgun Gothic','Apple SD Gothic Neo',sans-serif";
            // word-break:keep-all + white-space:normal → html2canvas에서도 글씨 잘림 없음
            const cellBase = `border:2px solid ${LINE}; font-family:${FONT}; padding:6px 10px; vertical-align:middle;`;

            const bodyHtml = rowsData.map((r) => {
                const bg = r.isAll ? ' background:#eef4ff;' : ''; // 고정 행만 연한 파란 배경으로 강조
                return `
                <tr style="height:${rowH}px;">
                    <td style="${cellBase}${bg} text-align:center; font-weight:800; color:${NAVY}; font-size:${titleFs}px; line-height:1.35; word-break:keep-all; white-space:normal;">${esc(r.title)}</td>
                    <td style="${cellBase}${bg} text-align:left; font-weight:600; color:#334155; font-size:${descFs}px; line-height:1.45; word-break:keep-all; white-space:normal;">${esc(r.desc)}</td>
                    <td style="${cellBase}${bg} text-align:center; padding:5px;">
                        <img src="${r.qr}" alt="${esc(r.title)}" style="width:${qrSize}px; height:${qrSize}px; display:block; margin:0 auto; object-fit:contain;">
                    </td>
                </tr>
            `;
            }).join('');

            wrap.innerHTML = `
                <table style="width:100%; border-collapse:collapse; table-layout:fixed; background:#fff;">
                    <colgroup><col style="width:26%"><col style="width:46%"><col style="width:28%"></colgroup>
                    <thead>
                        <tr style="height:${headH}px;">
                            <th style="${cellBase} background:#e8eefb; color:${NAVY}; font-size:21px; font-weight:900;">게시물 종류</th>
                            <th style="${cellBase} background:#e8eefb; color:${NAVY}; font-size:21px; font-weight:900;">설명</th>
                            <th style="${cellBase} background:#e8eefb; color:${NAVY}; font-size:21px; font-weight:900;">QR코드</th>
                        </tr>
                    </thead>
                    <tbody>${bodyHtml}</tbody>
                </table>
            `;
            initBoardPan(); // 팬/줌 활성화 + 화면에 맞춤
        };

        const closeQrBoard = () => { disposeBoardPan(); $('qr-board-mode').classList.add('hidden'); };

        const currentShipName = () => {
            const s = state.ships.find(x => x.id === $('admin-ship-select').value);
            return s ? s.shipName : '선박';
        };
        const triggerDownload = (url, name) => {
            const a = document.createElement('a');
            a.href = url; a.download = name;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        };

        /* ── 포스터를 고화질 캔버스로 캡처 (JPG/PDF/인쇄 공용) ──────────
         * width/height/window* 를 요소 실제 크기로 고정해 '글씨 하부 잘림' 방지.
         */
        const captureBoard = async () => {
            await loadBrandingImages(); // 로고가 준비된 뒤 캡처
            const board = $('capture-board');

            // 팬/줌 변형을 잠시 제거하고 원본 크기(1190x842)로 캡처 → 잘림/왜곡 방지
            disposeBoardPan();
            board.style.transform = 'none';
            board.style.transformOrigin = '0 0';
            await new Promise(r => setTimeout(r, 180));

            const canvas = await html2canvas(board, {
                scale: 3,
                useCORS: true,
                allowTaint: false,
                backgroundColor: '#ffffff',
                width: board.offsetWidth,
                height: board.offsetHeight,
                windowWidth: board.offsetWidth,
                windowHeight: board.offsetHeight,
                scrollX: 0,
                scrollY: 0
            });

            initBoardPan(); // 캡처 후 팬/줌 복구 + 화면 맞춤
            return canvas;
        };

        const withBusyBtn = async (selector, busyText, fn) => {
            const btn = document.querySelector(selector);
            const orig = btn ? btn.innerText : '';
            if (btn) { btn.innerText = busyText; btn.disabled = true; }
            try { await fn(); }
            finally { if (btn) { btn.innerText = orig; btn.disabled = false; } }
        };

        // 💾 JPG 저장
        const downloadBoardJpg = () => withBusyBtn('[data-action="download-jpg"]', "⏳ 캡처 중...", async () => {
            try {
                const canvas = await captureBoard();
                const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
                triggerDownload(dataUrl, `QR자료게시판_${currentShipName()}.jpg`);
            } catch (e) {
                console.error("JPG 저장 에러:", e);
                showAlert("JPG 저장 실패. 이미지/CORS 문제일 수 있어요.\n[PDF] 또는 [인쇄]를 이용해보세요.");
            }
        });

        // 📄 PDF 저장 (A4 세로)
        const downloadBoardPdf = () => withBusyBtn('[data-action="download-pdf"]', "⏳ PDF 생성 중...", async () => {
            try {
                const canvas = await captureBoard();
                const imgData = canvas.toDataURL('image/jpeg', 0.95);
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
                const pw = pdf.internal.pageSize.getWidth();
                const ph = pdf.internal.pageSize.getHeight();
                pdf.addImage(imgData, 'JPEG', 0, 0, pw, ph);
                pdf.save(`QR자료게시판_${currentShipName()}.pdf`);
            } catch (e) {
                console.error("PDF 저장 에러:", e);
                showAlert("PDF 생성 실패: " + e.message);
            }
        });

        const ACTIONS = {
            'edit-ship': editCurrentShip,
            'delete-ship': deleteCurrentShip,
            'delete-ship-image': deleteShipImage,
            'preview-board': openQrBoard,
            'download-jpg': downloadBoardJpg,
            'download-pdf': downloadBoardPdf,
            'close-board': closeQrBoard,
            'zoom-in': () => zoomBoard(1.3),
            'zoom-out': () => zoomBoard(0.77),
            'zoom-fit': fitBoard,
            'add-doc-files': () => addDocFiles(),
            'close-doc-edit': () => closeDocEdit(),
        };
        document.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-action]');
            if (btn && ACTIONS[btn.dataset.action]) ACTIONS[btn.dataset.action]();
        });

        const getEmojiForTitle = (title = '') => {
            if (title.includes('비상') || title.includes('대응') || title.includes('절차')) return '🚨';
            if (title.includes('명부')) return '👥';
            if (title.includes('도면') || title.includes('항로')) return '🗺️';
            if (title.includes('점검')) return '✅';
            if (title.includes('비품')) return '🧯';
            return '📄';
        };

        const renderAdminHome = () => {
            const grid = $('admin-ship-grid');
            if (!grid) return;
            grid.innerHTML = '';

            state.ships.forEach(shipObj => {
                const btn = document.createElement('button');
                btn.className = "bg-white p-4 rounded-3xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-3 hover:bg-brand-50 transition-all active:scale-95 h-56";
                btn.addEventListener('click', () => goToAdminDashboard(shipObj.id));

                const iconHtml = shipObj.shipImageUrl
                    ? `<img src="${shipObj.shipImageUrl}" class="w-full h-32 object-cover rounded-2xl shadow-sm" alt="">`
                    : `<div class="w-full h-32 flex items-center justify-center text-7xl drop-shadow-sm">🚢</div>`;
                btn.innerHTML = `${iconHtml}
                    <div class="flex flex-col items-center w-full">
                        <span class="font-bold text-sm text-slate-700 text-center w-full truncate ship-name-text"></span>
                        <span class="text-[11px] text-brand-600 font-bold bg-brand-50 px-2.5 py-1 rounded-full mt-1.5 border border-brand-100">문서함 보기</span>
                    </div>`;
                btn.querySelector('.ship-name-text').textContent = shipObj.shipName;
                grid.appendChild(btn);
            });

            const addBtn = document.createElement('button');
            addBtn.className = "bg-slate-50 p-5 rounded-3xl shadow-sm border-2 border-dashed border-slate-300 flex flex-col items-center justify-center gap-2 hover:bg-slate-100 transition-all active:scale-95 h-56 text-slate-500 hover:text-brand-600";
            addBtn.addEventListener('click', addNewShip);
            addBtn.innerHTML = `<div class="bg-white rounded-full w-12 h-12 flex items-center justify-center mb-1 shadow-sm border border-slate-100"><span class="text-2xl font-bold text-slate-400">+</span></div><span class="font-bold text-sm">새 선박 추가</span>`;
            grid.appendChild(addBtn);
        };

        function renderDocuments() {
            const publicList = $('document-list');
            const adminList = $('admin-doc-list');
            if (publicList) publicList.innerHTML = '';
            if (adminList) adminList.innerHTML = '';

            const isAdmin = auth.currentUser !== null;
            const adminShipId = $('admin-ship-select').value;

            if (isAdmin && adminShipId) {
                renderAdminDocs(adminList, state.documents.filter(d => d.shipId === adminShipId));
            } else if (state.viewerShipId) {
                renderViewerDocs(publicList, state.documents.filter(d => d.shipId === state.viewerShipId));
            }
        }

        function renderAdminDocs(adminList, docs) {
            if (!adminList) return;
            const countLabel = $('doc-count-label');
            if (countLabel) countLabel.textContent = `${docs.length} / ${MAX_DOCS}`;
            if (docs.length === 0) {
                adminList.innerHTML = `<div class="text-center py-8 text-slate-400 bg-slate-50 rounded-xl border border-slate-100 text-sm font-medium">문서가 없습니다.</div>`;
                return;
            }
            docs.forEach((data, i) => {
                const files = Array.isArray(data.files) ? data.files : [];

                const li = document.createElement('li');
                li.className = "bg-white p-2.5 rounded-xl border border-slate-100 shadow-sm flex items-center gap-1.5";

                // ▲▼ 순서 변경
                const reorder = document.createElement('div');
                reorder.className = "flex flex-col shrink-0";
                const upBtn = document.createElement('button');
                upBtn.className = "w-6 h-5 flex items-center justify-center text-slate-400 hover:text-brand-600 disabled:opacity-20 transition-colors";
                upBtn.disabled = (i === 0);
                upBtn.title = "위로";
                upBtn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>`;
                upBtn.addEventListener('click', () => reorderDoc(data.id, -1));
                const downBtn = document.createElement('button');
                downBtn.className = "w-6 h-5 flex items-center justify-center text-slate-400 hover:text-brand-600 disabled:opacity-20 transition-colors";
                downBtn.disabled = (i === docs.length - 1);
                downBtn.title = "아래로";
                downBtn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>`;
                downBtn.addEventListener('click', () => reorderDoc(data.id, 1));
                reorder.append(upBtn, downBtn);

                // 정보 (탭하면 미리보기 열림)
                const infoDiv = document.createElement('div');
                infoDiv.className = "flex items-center gap-2 overflow-hidden flex-1 cursor-pointer group";
                infoDiv.addEventListener('click', () => openDocViewer(data.title, files));

                const emojiSpan = document.createElement('span');
                emojiSpan.className = "text-lg flex-shrink-0";
                emojiSpan.textContent = getEmojiForTitle(data.title);

                const titleSpan = document.createElement('span');
                titleSpan.className = "font-bold text-slate-700 text-sm truncate group-hover:text-brand-600 transition-colors underline-offset-4 group-hover:underline";
                titleSpan.textContent = data.title;

                infoDiv.append(emojiSpan, titleSpan);

                if (files.length > 1) {
                    const badge = document.createElement('span');
                    badge.className = "shrink-0 bg-slate-100 text-slate-500 text-[10px] font-bold px-1.5 py-0.5 rounded";
                    badge.textContent = files.length + '장';
                    infoDiv.appendChild(badge);
                } else if (files.length === 0) {
                    const badge = document.createElement('span');
                    badge.className = "shrink-0 bg-red-50 text-red-500 border border-red-100 text-[10px] font-bold px-1.5 py-0.5 rounded";
                    badge.textContent = '비어있음';
                    infoDiv.appendChild(badge);
                }

                // 수정 / 삭제(쓰레기통)
                const btnDiv = document.createElement('div');
                btnDiv.className = "flex gap-1 shrink-0";

                const editBtn = document.createElement('button');
                editBtn.className = "text-slate-600 hover:bg-slate-100 text-xs font-bold px-2.5 py-1.5 rounded-lg border border-slate-200 transition-colors";
                editBtn.textContent = "수정";
                editBtn.addEventListener('click', () => openDocEdit(data.id));

                const delBtn = document.createElement('button');
                delBtn.className = "text-red-500 hover:bg-red-50 w-8 h-8 flex items-center justify-center rounded-lg border border-red-100 transition-colors";
                delBtn.title = "문서 삭제";
                delBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>`;
                delBtn.addEventListener('click', () => handleDelete(data.id, data.filePaths, data.title));

                btnDiv.append(editBtn, delBtn);
                li.append(reorder, infoDiv, btnDiv);
                adminList.appendChild(li);
            });
        }

        function renderViewerDocs(publicList, docs) {
            if (!publicList) return;
            if (docs.length === 0) {
                publicList.innerHTML = `<div class="col-span-2 text-center py-16 bg-white rounded-2xl shadow-sm border border-slate-100 text-slate-400 font-medium">등록된 문서가 없습니다.</div>`;
                return;
            }
            docs.forEach(data => {
                const files = Array.isArray(data.files) ? data.files : [];

                const btn = document.createElement('button');
                btn.className = "bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center gap-3 hover:bg-brand-50 transition-all active:scale-95 relative";
                btn.addEventListener('click', () => openDocViewer(data.title, files));

                let countBadge = '';
                if (files.length > 1) {
                    countBadge = `<span class="absolute top-2 right-2 bg-slate-100 text-slate-500 text-[10px] px-1.5 py-0.5 rounded font-bold">${files.length}장</span>`;
                } else if (files.length === 0) {
                    countBadge = `<span class="absolute top-2 right-2 bg-slate-50 text-slate-400 text-[10px] px-1.5 py-0.5 rounded font-bold">비어있음</span>`;
                }

                btn.innerHTML = `${countBadge}<span class="text-4xl drop-shadow-sm emoji-holder"></span><span class="font-bold text-sm text-slate-700 text-center leading-tight break-keep title-holder"></span>`;
                btn.querySelector('.emoji-holder').textContent = getEmojiForTitle(data.title);
                btn.querySelector('.title-holder').textContent = data.title;
                publicList.appendChild(btn);
            });
        }

        const MAX_FILES = 10;
        const MAX_SIZE = 20 * 1024 * 1024; // 20MB
        const MAX_DOCS = 12; // 선박당 최대 문서 수

        $('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const targetShipId = $('admin-ship-select').value;
            if (!targetShipId) return showAlert("선박을 먼저 추가해주세요.");

            if (state.documents.filter(d => d.shipId === targetShipId).length >= MAX_DOCS) {
                return showAlert(`문서는 선박당 최대 ${MAX_DOCS}개까지 등록할 수 있습니다.\n기존 문서를 삭제한 뒤 다시 등록해주세요.`);
            }

            const newTitle = $('doc-title').value.trim();
            const fileInput = $('file-upload');
            const files = Array.from(fileInput.files);

            if (files.length > MAX_FILES) return showAlert(`최대 ${MAX_FILES}개의 파일만 동시 업로드가 가능합니다.`);
            if (files.some(f => f.size > MAX_SIZE)) return showAlert("파일당 20MB 이하만 업로드 가능합니다.");

            const btn = $('upload-btn');
            btn.disabled = true;

            const uploadedPaths = [];
            const fileDataArray = [];

            try {
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const fileType = file.type.toLowerCase().includes('pdf') || file.name.toLowerCase().endsWith('.pdf') ? 'pdf' : 'image';
                    const filePath = `bulletins/${auth.currentUser.uid}/${Date.now()}_${Math.floor(Math.random() * 1000)}_${file.name}`;
                    const uploadTask = uploadBytesResumable(ref(storage, filePath), file);

                    await new Promise((resolve, reject) => {
                        uploadTask.on('state_changed',
                            (snapshot) => {
                                const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                                btn.innerText = `업로드 중... ${Math.round(progress)}% (${i + 1}/${files.length})`;
                            },
                            reject,
                            async () => {
                                const url = await getDownloadURL(uploadTask.snapshot.ref);
                                uploadedPaths.push(filePath);
                                fileDataArray.push({ url, type: fileType });
                                resolve();
                            }
                        );
                    });
                }

                await addDoc(collection(db, "bulletins"), {
                    title: newTitle,
                    description: $('doc-desc').value.trim() || autoDescribe(newTitle), // 비워두면 자동 작성
                    files: fileDataArray,
                    filePaths: uploadedPaths,
                    shipId: targetShipId,
                    ownerId: auth.currentUser.uid,
                    createdAt: serverTimestamp()
                });

                $('doc-title').value = '';
                $('doc-desc').value = '';
                fileInput.value = '';
                showAlert("새로운 문서가 성공적으로 등록되었습니다!");
            } catch (error) {
                await deleteStorageFiles(uploadedPaths);
                showAlert("업로드 실패: " + error.message);
            } finally {
                btn.innerText = "등록하기";
                btn.disabled = false;
            }
        });

        const handleDelete = (docId, filePaths, title) => {
            showConfirm(`'${title || '이 문서'}' 문서를 통째로 삭제할까요?\n첨부 파일도 함께 삭제됩니다.`, async (ok) => {
                if (!ok) return;
                try {
                    await deleteStorageFiles(filePaths);
                    await deleteDoc(doc(db, "bulletins", docId));
                } catch (error) {
                    showAlert("삭제 중 오류가 발생했습니다: " + error.message);
                }
            });
        };

        // 문서 순서 변경 (▲ -1 위로 / ▼ +1 아래로) → 해당 선박 문서 전체에 order 재부여
        const reorderDoc = async (docId, direction) => {
            const shipId = $('admin-ship-select').value;
            const docs = state.documents.filter(d => d.shipId === shipId); // 이미 docSort 순서
            const idx = docs.findIndex(d => d.id === docId);
            if (idx < 0) return;
            const swapIdx = idx + direction;
            if (swapIdx < 0 || swapIdx >= docs.length) return;

            const arr = docs.slice();
            [arr[idx], arr[swapIdx]] = [arr[swapIdx], arr[idx]];
            try {
                await Promise.all(arr.map((d, i) =>
                    d.order === i ? Promise.resolve() : updateDoc(doc(db, "bulletins", d.id), { order: i })
                ));
            } catch (e) {
                showAlert("순서 변경 실패: " + e.message);
            }
        };

        const openDocEdit = (docId) => {
            state.editingDocId = docId;
            renderDocEdit();
            const modal = $('doc-edit-modal');
            modal.classList.remove('hidden'); modal.classList.add('flex');
        };
        const closeDocEdit = () => {
            state.editingDocId = null;
            $('doc-edit-file').value = '';
            const modal = $('doc-edit-modal');
            modal.classList.add('hidden'); modal.classList.remove('flex');
        };
        const refreshDocEditIfOpen = () => {
            if (state.editingDocId && !$('doc-edit-modal').classList.contains('hidden')) renderDocEdit();
        };

        const renderDocEdit = () => {
            const d = state.documents.find(x => x.id === state.editingDocId);
            if (!d) return closeDocEdit();
            const files = Array.isArray(d.files) ? d.files : [];

            $('doc-edit-title').textContent = d.title;
            const grid = $('doc-edit-grid');
            grid.innerHTML = '';

            if (files.length === 0) {
                grid.innerHTML = `<div class="col-span-3 text-center text-slate-400 text-xs py-6 bg-slate-50 rounded-xl border border-slate-100">현재 빈 문서입니다.<br>아래에서 파일을 추가해주세요.</div>`;
                return;
            }
            files.forEach((f, idx) => {
                const cell = document.createElement('div');
                cell.className = "relative aspect-square rounded-lg overflow-hidden border border-slate-200 bg-slate-100 flex items-center justify-center";

                if (f.type === 'pdf') {
                    cell.innerHTML = `<span class="text-2xl">📄</span>`;
                } else {
                    const img = document.createElement('img');
                    img.src = f.url; img.className = "w-full h-full object-cover";
                    cell.appendChild(img);
                }
                const numBadge = document.createElement('span');
                numBadge.className = "absolute bottom-1 left-1 bg-black/60 text-white text-[9px] font-bold px-1.5 py-0.5 rounded";
                numBadge.textContent = (idx + 1);
                cell.appendChild(numBadge);

                const del = document.createElement('button');
                del.className = "absolute top-1 right-1 bg-red-500 hover:bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold shadow";
                del.textContent = '×';
                del.addEventListener('click', () => removeDocFile(idx));
                cell.appendChild(del);
                grid.appendChild(cell);
            });
        };

        const removeDocFile = (idx) => {
            const d = state.documents.find(x => x.id === state.editingDocId);
            if (!d) return;

            showConfirm(`${idx + 1}번 파일을 삭제할까요?`, async (ok) => {
                if (!ok) return;
                const files = Array.isArray(d.files) ? d.files : [];
                const paths = Array.isArray(d.filePaths) ? d.filePaths : [];
                const removedPath = paths[idx];
                const newFiles = files.filter((_, i) => i !== idx);
                const newPaths = paths.filter((_, i) => i !== idx);
                try {
                    await updateDoc(doc(db, "bulletins", d.id), { files: newFiles, filePaths: newPaths });
                    if (removedPath) { try { await deleteObject(ref(storage, removedPath)); } catch (_) {} }
                } catch (e) {
                    showAlert("삭제 실패: " + e.message);
                }
            });
        };

        const addDocFiles = async () => {
            const d = state.documents.find(x => x.id === state.editingDocId);
            if (!d) return;
            const input = $('doc-edit-file');
            const files = Array.from(input.files);
            if (files.length === 0) return showAlert("추가할 파일을 선택해주세요.");

            const existing = Array.isArray(d.files) ? d.files.length : 0;
            if (existing + files.length > 20) return showAlert("문서당 최대 20개까지 담을 수 있습니다.");
            if (files.some(f => f.size > MAX_SIZE)) return showAlert("파일당 20MB 이하만 업로드 가능합니다.");

            const btn = $('doc-edit-add-btn');
            const orig = btn.innerText;
            btn.disabled = true;

            const addedFiles = [];
            const addedPaths = [];
            try {
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const fileType = file.type.toLowerCase().includes('pdf') || file.name.toLowerCase().endsWith('.pdf') ? 'pdf' : 'image';
                    const filePath = `bulletins/${auth.currentUser.uid}/${Date.now()}_${Math.floor(Math.random() * 1000)}_${file.name}`;
                    const uploadTask = uploadBytesResumable(ref(storage, filePath), file);
                    await new Promise((resolve, reject) => {
                        uploadTask.on('state_changed',
                            (s) => { btn.innerText = `추가 중... ${Math.round(s.bytesTransferred / s.totalBytes * 100)}% (${i + 1}/${files.length})`; },
                            reject,
                            async () => {
                                const url = await getDownloadURL(uploadTask.snapshot.ref);
                                addedPaths.push(filePath);
                                addedFiles.push({ url, type: fileType });
                                resolve();
                            }
                        );
                    });
                }
                const mergedFiles = [...(Array.isArray(d.files) ? d.files : []), ...addedFiles];
                const mergedPaths = [...(Array.isArray(d.filePaths) ? d.filePaths : []), ...addedPaths];
                await updateDoc(doc(db, "bulletins", d.id), { files: mergedFiles, filePaths: mergedPaths });
                input.value = '';
                showAlert(`${addedFiles.length}개 파일이 추가되었습니다.`);
            } catch (e) {
                await deleteStorageFiles(addedPaths);
                showAlert("추가 실패: " + e.message);
            } finally {
                btn.innerText = orig;
                btn.disabled = false;
            }
        };

        const disposePanzooms = () => {
            state.panzooms.forEach(pz => { try { pz.dispose(); } catch (_) {} });
            state.panzooms = [];
        };

        window.openDocViewer = (title, fileDataArray) => {
            state.viewerFiles = Array.isArray(fileDataArray) ? fileDataArray : [];
            state.viewerIndex = 0;

            $('viewer-title').textContent = title;
            $('doc-viewer-mode').classList.remove('translate-y-full');

            renderViewerCurrentPage();
        };

        const renderViewerCurrentPage = () => {
            const viewerContent = $('viewer-content');
            const scrollArea = $('viewer-scroll-area');
            disposePanzooms();

            const files = state.viewerFiles;
            const idx = state.viewerIndex;
            const nav = $('viewer-nav');

            if (files.length <= 1) {
                nav.classList.add('hidden');
            } else {
                nav.classList.remove('hidden');
                $('viewer-page-text').textContent = `${idx + 1} / ${files.length}`;
                $('viewer-prev').disabled = (idx === 0);
                $('viewer-next').disabled = (idx === files.length - 1);
            }

            viewerContent.innerHTML = `<div class="flex flex-col items-center justify-center my-20"><div class="animate-spin text-4xl text-brand-500">⏳</div></div>`;

            setTimeout(() => {
                viewerContent.innerHTML = '';
                scrollArea.scrollTop = 0;

                if (files.length === 0) {
                    const isAdmin = auth.currentUser !== null;
                    const adminMsg = isAdmin
                        ? "<br>아래 [닫기]를 누르고 목록에서 [수정] 버튼을 눌러 문서를 채워주세요."
                        : "<br>관리자가 아직 파일을 등록하지 않았습니다.";
                    viewerContent.innerHTML = `
                        <div class="flex flex-col items-center justify-center text-slate-400 py-32 text-center h-[50vh]">
                            <span class="text-5xl mb-4 grayscale opacity-50">📭</span>
                            <p class="text-sm font-bold mb-1">현재 비어있는 문서입니다.</p>
                            <p class="text-[11px] leading-relaxed">${adminMsg}</p>
                        </div>`;
                    return;
                }

                const fileData = files[idx];
