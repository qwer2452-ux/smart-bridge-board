                const wrapper = document.createElement('div');
                wrapper.className = "w-full bg-white rounded-xl shadow-lg relative min-h-[50vh] flex flex-col";

                if (fileData.type === 'pdf') {
                    renderPdf(wrapper, fileData.url);
                } else {
                    renderImage(wrapper, fileData.url);
                }
                viewerContent.appendChild(wrapper);
            }, 50);
        };

        $('viewer-prev').addEventListener('click', () => {
            if (state.viewerIndex > 0) {
                state.viewerIndex--;
                renderViewerCurrentPage();
            }
        });
        $('viewer-next').addEventListener('click', () => {
            if (state.viewerIndex < state.viewerFiles.length - 1) {
                state.viewerIndex++;
                renderViewerCurrentPage();
            }
        });

        function renderPdf(wrapper, url) {
            wrapper.className += " p-2 pdf-canvas-wrapper bg-slate-200";

            const bar = document.createElement('div');
            bar.className = "flex justify-end mb-2";
            const openLink = document.createElement('a');
            openLink.href = url;
            openLink.target = "_blank";
            openLink.rel = "noopener";
            openLink.className = "text-[11px] font-bold text-brand-600 bg-white px-3 py-1.5 rounded-lg border border-brand-100 shadow-sm";
            openLink.textContent = "↗ 새 탭에서 원본 열기";
            bar.appendChild(openLink);
            wrapper.appendChild(bar);

            const loadingMsg = document.createElement('p');
            loadingMsg.className = "text-center text-sm font-bold text-slate-500 py-10";
            loadingMsg.textContent = "PDF 렌더링 중...";
            wrapper.appendChild(loadingMsg);

            const pdfjsLib = window['pdfjs-dist/build/pdf'];
            const dpr = window.devicePixelRatio || 1;

            pdfjsLib.getDocument(url).promise.then(async (pdf) => {
                loadingMsg.remove();
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const cssViewport = page.getViewport({ scale: 1.5 });
                    const renderViewport = page.getViewport({ scale: 1.5 * dpr });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = renderViewport.width;
                    canvas.height = renderViewport.height;
                    canvas.style.width = cssViewport.width + 'px';
                    canvas.style.height = cssViewport.height + 'px';
                    wrapper.appendChild(canvas);
                    await page.render({ canvasContext: context, viewport: renderViewport }).promise;
                }
            }).catch((err) => {
                console.error('[PDF 로딩 실패]', err);
                loadingMsg.remove();
                const box = document.createElement('div');
                box.className = "flex flex-col items-center gap-3 py-12 px-4 text-center";
                box.innerHTML = `
                    <span class="text-3xl">📄</span>
                    <p class="text-sm font-bold text-slate-600">이 화면에서 PDF를 표시할 수 없습니다.</p>
                    <p class="text-[11px] text-slate-400 leading-relaxed">아래 버튼으로 원본을 바로 열어보세요.</p>`;
                const openBtn = document.createElement('a');
                openBtn.href = url; openBtn.target = "_blank"; openBtn.rel = "noopener";
                openBtn.className = "mt-1 bg-brand-600 text-white font-bold text-sm px-5 py-3 rounded-xl shadow-md";
                openBtn.textContent = "새 탭에서 PDF 열기";
                box.appendChild(openBtn);
                wrapper.appendChild(box);
            });
        }

        function renderImage(wrapper, url) {
            wrapper.style.height = "85vh";
            const imgContainer = document.createElement('div');
            imgContainer.className = "w-full h-full overflow-hidden flex items-center justify-center bg-slate-900 rounded-xl relative touch-none";

            const img = document.createElement('img');
            img.src = url;
            img.className = "max-w-full max-h-full object-contain cursor-move";
            imgContainer.appendChild(img);

            const hint = document.createElement('div');
            hint.className = "absolute bottom-3 left-1/2 -translate-x-1/2 bg-black/60 text-white text-[10px] px-3 py-1.5 rounded-full pointer-events-none";
            hint.textContent = "손가락으로 확대/이동 가능";
            imgContainer.appendChild(hint);

            wrapper.appendChild(imgContainer);

            img.onload = () => {
                const pz = panzoom(img, { maxZoom: 5, minZoom: 1, bounds: true, boundsPadding: 0.2 });
                state.panzooms.push(pz);
            };
        }

        const closeDocViewer = () => {
            $('doc-viewer-mode').classList.add('translate-y-full');
            disposePanzooms();
        };
        $('doc-viewer-close').addEventListener('click', closeDocViewer);

        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            if (!$('doc-edit-modal').classList.contains('hidden')) closeDocEdit();
            else if (!$('qr-board-mode').classList.contains('hidden')) closeQrBoard();
            else if (!$('doc-viewer-mode').classList.contains('translate-y-full')) closeDocViewer();
        });
    </script>

    <!-- 서비스워커 등록 (PWA 설치 조건 충족) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }
    </script>
</body>
