<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 화면 확대/축소가 가능하도록 maximum-scale=1.0, user-scalable=no 를 제거했습니다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <title>Smart Bridge Board</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' } }
                }
            }
        };
    </script>
    <style>
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        body { -webkit-tap-highlight-color: transparent; user-select: none; overscroll-behavior-y: none; height: 100dvh; overflow: hidden; }
        input, select, textarea { user-select: auto; }
        .hide-view { display: none !important; }
    </style>
</head>
<body class="bg-slate-900 flex justify-center text-slate-800 antialiased selection:bg-brand-200">

    <div class="w-full max-w-md bg-white h-[100dvh] shadow-2xl relative overflow-hidden flex flex-col">

        <!-- ========================================== -->
        <!-- 1. 관리자 전용 로그인 화면 -->
        <!-- ========================================== -->
        <div id="login-screen" class="flex-col h-full w-full absolute inset-0 bg-slate-50 z-30 hide-view justify-center items-center p-6">
            <div class="bg-white w-full max-w-sm rounded-3xl shadow-xl p-8 border border-slate-100">
                <div class="text-center mb-8">
                    <div class="bg-brand-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-brand-600">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </div>
                    <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Smart Bridge Board</h1>
                    <p class="text-slate-500 text-sm mt-2 font-medium">관리자 전용 로그인</p>
                </div>
                
                <form onsubmit="handleLogin(event)" class="flex flex-col gap-4">
                    <div>
                        <input type="email" id="email" required class="w-full px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-brand-500 transition-all placeholder-slate-400 font-medium" placeholder="이메일 주소">
                    </div>
                    <div>
                        <input type="password" id="password" required class="w-full px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-brand-500 transition-all placeholder-slate-400 font-medium" placeholder="비밀번호">
                    </div>
                    <button id="login-btn" type="submit" class="w-full bg-brand-600 text-white font-bold py-4 rounded-xl mt-2 hover:bg-brand-700 shadow-lg shadow-brand-200 transition-all active:scale-95">
                        접속하기
                    </button>
                </form>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- 2. 관리자 메인 홈 화면 -->
        <!-- ========================================== -->
        <div id="admin-home-mode" class="flex-col h-full w-full absolute inset-0 bg-slate-50 z-40 hide-view">
            <header class="bg-brand-900 text-white p-6 shadow-md rounded-b-2xl">
                <div class="flex items-center justify-between mb-1">
                    <h1 class="text-2xl font-bold tracking-tight">Smart Bridge Board</h1>
                    <button onclick="handleLogout()" class="text-xs font-bold bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded-lg transition-colors backdrop-blur-sm">로그아웃</button>
                </div>
                <p class="text-brand-100 text-sm font-medium">환영합니다! 관리할 선박을 선택하세요.</p>
            </header>
            <main class="flex-1 overflow-y-auto p-4">
                <div id="admin-ship-grid" class="grid grid-cols-2 gap-3"></div>
            </main>
        </div>

        <!-- ========================================== -->
        <!-- 3. 열람자 화면 (QR코드 접속 시) -->
        <!-- ========================================== -->
        <div id="viewer-mode" class="flex-col h-full w-full absolute inset-0 bg-slate-50 z-20 hide-view">
            <header class="bg-brand-900 text-white p-6 shadow-md rounded-b-2xl">
                <div class="flex items-center justify-between">
                    <div>
                        <h1 id="viewer-header-title" class="text-2xl font-bold tracking-tight line-clamp-1">선박명</h1>
                        <p class="text-brand-100 text-sm mt-1">QR 선교 종합 게시판</p>
                    </div>
                    <div class="opacity-90 flex-shrink-0 ml-3">
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-brand-200 drop-shadow-md">
                            <circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle>
                            <line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line>
                            <line x1="22" y1="12" x2="20" y2="12"></line><line x1="4" y1="12" x2="2" y2="12"></line>
                            <line x1="19.07" y1="4.93" x2="17.66" y2="6.34"></line><line x1="6.34" y1="17.66" x2="4.93" y2="19.07"></line>
                            <line x1="19.07" y1="19.07" x2="17.66" y2="17.66"></line><line x1="6.34" y1="6.34" x2="4.93" y2="4.93"></line>
                        </svg>
                    </div>
                </div>
            </header>
            <main class="flex-1 overflow-y-auto p-4">
                <div id="document-list" class="grid grid-cols-2 gap-3"></div>
            </main>
        </div>

        <!-- ========================================== -->
        <!-- 4. 관리자 대시보드 (선박 클릭 시 진입) -->
        <!-- ========================================== -->
        <div id="admin-mode" class="flex-col h-full w-full absolute inset-0 bg-slate-50 z-50 hide-view">
            <header class="bg-slate-800 text-white p-4 shadow-md flex items-center gap-2">
                <button onclick="goBackToAdminHome()" class="text-slate-300 hover:text-white p-1.5 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                    </svg>
                </button>
                <h1 class="text-lg font-bold">⚙️ 선박 관리 대시보드</h1>
            </header>
            
            <main class="flex-1 overflow-y-auto p-4 flex flex-col gap-6">
                <!-- 선박 관리 섹션 -->
                <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-3">
                    <label class="block text-sm font-extrabold text-brand-900">🚢 현재 관리 중인 선박</label>
                    <select id="admin-ship-select" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-800 outline-none focus:ring-2 focus:ring-brand-500"></select>
                    <div class="flex gap-2 mt-1">
                        <button onclick="editCurrentShip()" class="flex-1 bg-slate-50 text-slate-600 hover:bg-slate-100 font-bold py-2 rounded-lg text-xs transition-colors">✏️ 이름 수정</button>
                        <button onclick="deleteCurrentShip()" class="flex-1 bg-red-50 text-red-500 hover:bg-red-100 font-bold py-2 rounded-lg text-xs transition-colors">🗑️ 배 삭제</button>
                    </div>
                </section>

                <!-- 문서 업로드 섹션 -->
                <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-sm font-extrabold text-slate-800 mb-4 border-b border-slate-100 pb-2">📤 새 문서 등록</h2>
                    <form onsubmit="handleUpload(event)" class="flex flex-col gap-3">
                        <input type="text" id="doc-title" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm font-medium" placeholder="문서 제목 (예: 비상대응매뉴얼)">
                        <input type="file" id="file-upload" class="w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 cursor-pointer" accept=".pdf, image/*" multiple required>
                        <button type="submit" id="upload-btn" class="w-full bg-slate-800 text-white font-bold py-3.5 rounded-xl hover:bg-slate-900 shadow-md mt-2">등록하기</button>
                    </form>
                </section>

                <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-6">
                    <h2 class="text-sm font-extrabold text-slate-800 mb-4 border-b border-slate-100 pb-2">📁 등록된 문서 관리</h2>
                    <ul id="admin-doc-list" class="flex flex-col gap-2"></ul>
                </section>
            </main>
        </div>

        <!-- ========================================== -->
        <!-- 5. 문서 뷰어 모달 (핵심 수정 영역) -->
        <!-- ========================================== -->
        <div id="doc-viewer-mode" class="fixed inset-0 bg-slate-900 z-[100] flex flex-col transform translate-y-full transition-transform duration-300 max-w-md mx-auto">
            <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex justify-between items-center z-10 flex-shrink-0">
                <h2 id="viewer-title" class="text-base font-bold text-white line-clamp-1">문서 로딩중</h2>
                <button onclick="closeDocViewer()" class="bg-slate-700 hover:bg-slate-600 text-white rounded-full w-8 h-8 flex items-center justify-center transition-colors"><span class="font-bold text-lg">&times;</span></button>
            </header>
            <main class="flex-1 bg-slate-900 overflow-y-auto relative p-2" id="viewer-scroll-area">
                <div id="viewer-content" class="w-full min-h-full flex flex-col items-center justify-center gap-4 pb-10"></div>
            </main>
        </div>

        <!-- 커스텀 팝업창 -->
        <div id="custom-prompt-modal" class="fixed inset-0 bg-black/60 z-[110] hidden items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center">
                <h3 id="custom-prompt-msg" class="text-lg font-bold text-slate-800 mb-4 whitespace-pre-line">알림</h3>
                <input type="text" id="custom-prompt-input" class="w-full px-4 py-3 border border-slate-300 rounded-xl mb-5 outline-none focus:ring-2 focus:ring-brand-500 text-center font-medium">
                <div class="flex justify-center gap-3">
                    <button id="custom-prompt-cancel" onclick="closeCustomPrompt(false)" class="w-1/2 py-3.5 bg-slate-100 text-slate-700 rounded-xl font-bold">취소</button>
                    <button onclick="closeCustomPrompt(true)" class="w-1/2 py-3.5 bg-brand-600 text-white rounded-xl font-bold shadow-md">확인</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Firebase SDK & 로직 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp, query } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAo7hgaaj4NedahYZFEQfZqbIVi596A_XQ",
            authDomain: "smart-bridge-board.firebaseapp.com",
            projectId: "smart-bridge-board",
            storageBucket: "smart-bridge-board.firebasestorage.app",
            messagingSenderId: "81406484031",
            appId: "1:81406484031:web:68bb7580e46b1d5348628a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let allDocuments = [];
        let dynamicShips = JSON.parse(localStorage.getItem('smartBridgeShips')) || [];
        
        try {
            const urlParams = new URLSearchParams(window.location.search);
            window.currentViewerShipId = urlParams.get('ship');
        } catch(e) { window.currentViewerShipId = null; }

        // UI 모달 제어
        let promptCallback = null;
        window.showPrompt = (msg, defaultVal, isAlertOnly, callback) => {
            document.getElementById('custom-prompt-msg').innerText = msg;
            const input = document.getElementById('custom-prompt-input');
            const cancelBtn = document.getElementById('custom-prompt-cancel');
            
            if (isAlertOnly) {
                input.style.display = 'none';
                cancelBtn.style.display = 'none';
            } else {
                input.style.display = 'block';
                cancelBtn.style.display = 'block';
                input.value = defaultVal || '';
            }

            document.getElementById('custom-prompt-modal').classList.remove('hidden');
            document.getElementById('custom-prompt-modal').classList.add('flex');
            if(!isAlertOnly) setTimeout(() => input.focus(), 100);
            promptCallback = callback;
        };

        window.closeCustomPrompt = (isOk) => {
            document.getElementById('custom-prompt-modal').classList.add('hidden');
            document.getElementById('custom-prompt-modal').classList.remove('flex');
            if(promptCallback) promptCallback(isOk ? document.getElementById('custom-prompt-input').value : null);
        };
        const showAlert = (msg, callback) => { window.showPrompt(msg, "", true, callback); };

        onAuthStateChanged(auth, (user) => {
            const loginScreen = document.getElementById('login-screen');
            const viewerMode = document.getElementById('viewer-mode');
            const adminHomeMode = document.getElementById('admin-home-mode');
            const adminMode = document.getElementById('admin-mode');

            loginScreen.classList.add('hide-view'); loginScreen.classList.remove('flex');
            viewerMode.classList.add('hide-view'); viewerMode.classList.remove('flex');
            adminHomeMode.classList.add('hide-view'); adminHomeMode.classList.remove('flex');
            adminMode.classList.add('hide-view'); adminMode.classList.remove('flex');

            if (user) {
                adminHomeMode.classList.remove('hide-view');
                adminHomeMode.classList.add('flex');
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
                window.renderAdminHome();
            } else {
                if (window.currentViewerShipId) {
                    viewerMode.classList.remove('hide-view');
                    viewerMode.classList.add('flex');
                } else {
                    loginScreen.classList.remove('hide-view');
                    loginScreen.classList.add('flex');
                }
            }
            renderDocuments();
        });

        window.handleLogin = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const originalText = btn.innerText;
            btn.innerText = "확인 중..."; btn.disabled = true;
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
            } catch (error) { 
                showAlert("아이디 또는 비밀번호가 올바르지 않습니다."); 
            } finally {
                btn.innerText = originalText; btn.disabled = false;
            }
        };

        window.handleLogout = async () => { await signOut(auth); };

        window.goToAdminDashboard = (shipName) => {
            document.getElementById('admin-home-mode').classList.add('hide-view');
            document.getElementById('admin-home-mode').classList.remove('flex');
            document.getElementById('admin-mode').classList.remove('hide-view');
            document.getElementById('admin-mode').classList.add('flex');
            
            document.getElementById('admin-ship-select').value = shipName;
            renderDocuments();
        };

        window.goBackToAdminHome = () => {
            document.getElementById('admin-mode').classList.add('hide-view');
            document.getElementById('admin-mode').classList.remove('flex');
            document.getElementById('admin-home-mode').classList.remove('hide-view');
            document.getElementById('admin-home-mode').classList.add('flex');
            window.renderAdminHome();
        };

        const saveShips = () => { localStorage.setItem('smartBridgeShips', JSON.stringify(dynamicShips)); };

        const updateShipSelectOptions = (selectedShip = null) => {
            const selectEl = document.getElementById('admin-ship-select');
            const currentVal = selectedShip || selectEl.value || (dynamicShips.length > 0 ? dynamicShips[0] : '');
            
            selectEl.innerHTML = '';
            if (dynamicShips.length === 0) {
                selectEl.innerHTML = '<option value="">등록된 선박이 없습니다</option>';
                return;
            }
            dynamicShips.forEach(ship => {
                const opt = document.createElement('option');
                opt.value = ship;
                opt.textContent = ship;
                if(ship === currentVal) opt.selected = true;
                selectEl.appendChild(opt);
            });
        };

        window.addNewShip = () => {
            window.showPrompt("추가할 선박 이름을 입력하세요", "", false, (shipName) => {
                if(shipName && shipName.trim()) {
                    const trimmed = shipName.trim();
                    if(!dynamicShips.includes(trimmed)) {
                        dynamicShips.push(trimmed);
                        saveShips();
                    }
                    updateShipSelectOptions(trimmed);
                    renderDocuments();
                    window.renderAdminHome();
                }
            });
        };

        window.editCurrentShip = () => {
            const currentShip = document.getElementById('admin-ship-select').value;
            if(!currentShip) return showAlert("선택된 선박이 없습니다.");
            
            window.showPrompt(`'${currentShip}'의 새 이름 입력:`, currentShip, false, (newName) => {
                if(newName && newName.trim() && newName.trim() !== currentShip) {
                    const trimmed = newName.trim();
                    dynamicShips[dynamicShips.indexOf(currentShip)] = trimmed;
                    saveShips();
                    updateShipSelectOptions(trimmed);
                    renderDocuments();
                    window.renderAdminHome();
                }
            });
        };

        window.deleteCurrentShip = () => {
            const currentShip = document.getElementById('admin-ship-select').value;
            if(!currentShip) return;
            window.showPrompt(`'${currentShip}' 삭제 시 '삭제' 입력`, "", false, (res) => {
                if(res === '삭제') {
                    dynamicShips = dynamicShips.filter(s => s !== currentShip);
                    saveShips();
                    updateShipSelectOptions();
                    renderDocuments();
                    window.goBackToAdminHome();
                }
            });
        };

        const getEmojiForTitle = (title) => {
            if(title.includes('비상') || title.includes('대응')) return '🚨';
            if(title.includes('명부')) return '👥';
            if(title.includes('도면') || title.includes('항로')) return '🗺️';
            return '📄';
        };

        window.renderAdminHome = () => {
            const grid = document.getElementById('admin-ship-grid');
            if (!grid) return;
            grid.innerHTML = '';

            dynamicShips.forEach(ship => {
                const btn = document.createElement('button');
                btn.className = "bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex flex-col items-center justify-center gap-3 hover:bg-brand-50 transition-all active:scale-95 h-36";
                btn.onclick = () => window.goToAdminDashboard(ship);
                const docCount = allDocuments.filter(d => d.shipId === ship).length;
                btn.innerHTML = `<span class="text-5xl drop-shadow-sm">🚢</span>
                    <div class="flex flex-col items-center w-full">
                        <span class="font-bold text-sm text-slate-700 text-center w-full truncate">${ship}</span>
                        <span class="text-[11px] text-brand-600 font-bold bg-brand-50 px-2.5 py-1 rounded-full mt-1.5 border border-brand-100">문서 ${docCount}건</span>
                    </div>`;
                grid.appendChild(btn);
            });

            const addBtn = document.createElement('button');
            addBtn.className = "bg-slate-50 p-5 rounded-3xl shadow-sm border-2 border-dashed border-slate-300 flex flex-col items-center justify-center gap-2 hover:bg-slate-100 transition-all active:scale-95 h-36 text-slate-500 hover:text-brand-600";
            addBtn.onclick = window.addNewShip;
            addBtn.innerHTML = `<div class="bg-white rounded-full w-12 h-12 flex items-center justify-center mb-1 shadow-sm border border-slate-100"><span class="text-2xl font-bold text-slate-400">+</span></div><span class="font-bold text-sm">새 선박 추가</span>`;
            grid.appendChild(addBtn);
        };

        const renderDocuments = () => {
            const publicList = document.getElementById('document-list');
            const adminList = document.getElementById('admin-doc-list');
            const viewerTitleEl = document.getElementById('viewer-header-title');
            
            if (publicList) publicList.innerHTML = '';
            if (adminList) adminList.innerHTML = '';

            const viewerShipId = window.currentViewerShipId;
            const isAdmin = auth.currentUser !== null;
            
            updateShipSelectOptions();
            const adminShipId = document.getElementById('admin-ship-select').value;

            if (isAdmin) {
                const adminDocs = allDocuments.filter(d => d.shipId === adminShipId);
                if (adminDocs.length === 0) {
                    adminList.innerHTML = `<div class="text-center py-8 text-slate-400 bg-slate-50 rounded-xl border border-slate-100 text-sm font-medium">문서가 없습니다.</div>`;
                } else {
                    adminDocs.forEach(data => {
                        const li = document.createElement('li');
                        li.className = "bg-white p-3 rounded-xl border border-slate-100 shadow-sm flex justify-between items-center";
                        const safePaths = JSON.stringify(data.filePaths || []).replace(/"/g, '&quot;');
                        const fileUrls = Array.isArray(data.fileUrls) ? data.fileUrls : (data.fileUrl ? [data.fileUrl] : []);
                        const safeUrls = JSON.stringify(fileUrls).replace(/"/g, '&quot;');
                        const safeTitle = data.title.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                        
                        li.innerHTML = `
                            <div class="flex items-center gap-2 overflow-hidden flex-1 cursor-pointer group" onclick="window.openDocViewer('${safeTitle}', ${safeUrls})">
                                <span class="text-lg flex-shrink-0 group-hover:scale-110 transition-transform">${getEmojiForTitle(data.title)}</span>
                                <span class="font-bold text-slate-700 text-sm truncate group-hover:text-brand-600 transition-colors underline-offset-4 group-hover:underline">${data.title}</span>
                            </div>
                            <div class="flex gap-1.5 flex-shrink-0 ml-2">
                                <button onclick="window.openDocViewer('${safeTitle}', ${safeUrls})" class="text-brand-600 hover:bg-brand-50 text-xs font-bold px-3 py-1.5 rounded-lg border border-brand-100 transition-colors">보기</button>
                                <button onclick="handleDelete('${data.id}', ${safePaths})" class="text-red-500 hover:bg-red-50 text-xs font-bold px-3 py-1.5 rounded-lg border border-red-100 transition-colors">삭제</button>
                            </div>
                        `;
                        adminList.appendChild(li);
                    });
                }
            } else if (viewerShipId) {
                viewerTitleEl.textContent = viewerShipId;
                const shipDocs = allDocuments.filter(d => d.shipId === viewerShipId);
                
                if(shipDocs.length === 0) {
                    publicList.innerHTML = `<div class="col-span-2 text-center py-16 bg-white rounded-2xl shadow-sm border border-slate-100 text-slate-400 font-medium">등록된 문서가 없습니다.</div>`;
                } else {
                    shipDocs.forEach(data => {
                        const btn = document.createElement('button');
                        btn.className = "bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center gap-3 hover:bg-brand-50 transition-all active:scale-95";
                        const fileUrls = Array.isArray(data.fileUrls) ? data.fileUrls : (data.fileUrl ? [data.fileUrl] : []);
                        btn.onclick = () => window.openDocViewer(data.title, fileUrls);
                        const multiBadge = fileUrls.length > 1 ? `<span class="absolute top-2 right-2 bg-slate-100 text-slate-500 text-[10px] px-1.5 py-0.5 rounded font-bold">${fileUrls.length}장</span>` : '';
                        
                        btn.innerHTML = `${multiBadge}<span class="text-4xl drop-shadow-sm">${getEmojiForTitle(data.title)}</span><span class="font-bold text-sm text-slate-700 text-center leading-tight break-keep">${data.title}</span>`;
                        publicList.appendChild(btn);
                    });
                }
            }
        };

        onSnapshot(query(collection(db, "bulletins")), (snapshot) => {
            allDocuments = [];
            let dbShips = new Set();
            
            snapshot.forEach(doc => {
                const data = doc.data();
                allDocuments.push({ id: doc.id, ...data });
                if(data.shipId) dbShips.add(data.shipId);
            });
            allDocuments.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));

            dbShips.forEach(ship => { if(!dynamicShips.includes(ship)) dynamicShips.push(ship); });
            saveShips();
            renderDocuments();
            window.renderAdminHome();
        });

        window.handleUpload = async (e) => {
            e.preventDefault();
            const targetShipId = document.getElementById('admin-ship-select').value;
            if(!targetShipId) return showAlert("선박을 먼저 추가해주세요.");
            
            const btn = document.getElementById('upload-btn');
            const originalText = btn.innerText;
            btn.innerText = "서버로 전송 중... ⏳"; btn.disabled = true;
            
            try {
                const files = Array.from(document.getElementById('file-upload').files);
                const fileUrls = [], filePaths = [];
                for(let file of files) {
                    const filePath = `bulletins/${Date.now()}_${Math.floor(Math.random()*1000)}_${file.name}`;
                    const storageRef = ref(storage, filePath);
                    await uploadBytes(storageRef, file);
                    fileUrls.push(await getDownloadURL(storageRef));
                    filePaths.push(filePath);
                }
                
                await addDoc(collection(db, "bulletins"), {
                    title: document.getElementById('doc-title').value,
                    fileUrls: fileUrls, filePaths: filePaths,
                    shipId: targetShipId, createdAt: serverTimestamp()
                });
                
                document.getElementById('doc-title').value = '';
                document.getElementById('file-upload').value = '';
                showAlert(`성공적으로 등록되었습니다!`);
            } catch(error) { showAlert("업로드 실패!"); }
            
            btn.innerText = originalText; btn.disabled = false;
        };

        window.handleDelete = (docId, filePaths) => {
            window.showPrompt("이 문서를 삭제하시겠습니까?\n(진행하려면 '삭제' 입력)", "", false, async (res) => {
                if(res === '삭제') {
                    try {
                        if(filePaths) { for(let path of filePaths) { try { await deleteObject(ref(storage, path)); } catch(e){} } }
                        await deleteDoc(doc(db, "bulletins", docId));
                        showAlert("안전하게 삭제되었습니다.");
                    } catch(error) {}
                }
            });
        };

        // =====================================
        // 완벽하게 수정된 PDF 및 이미지 뷰어
        // =====================================
        window.openDocViewer = (title, fileUrls) => {
            const viewerMode = document.getElementById('doc-viewer-mode');
            const viewerTitle = document.getElementById('viewer-title');
            const viewerContent = document.getElementById('viewer-content');
            const scrollArea = document.getElementById('viewer-scroll-area');
            
            viewerTitle.textContent = title;
            viewerContent.innerHTML = `<div class="flex flex-col items-center justify-center my-20"><div class="animate-spin text-4xl text-brand-500">⏳</div></div>`;
            viewerMode.classList.remove('translate-y-full');

            setTimeout(() => {
                viewerContent.innerHTML = '';
                // 뷰어 오픈 시 스크롤 최상단으로 리셋
                scrollArea.scrollTop = 0; 
                
                fileUrls.forEach(url => {
                    const urlLower = url.toLowerCase();
                    // Firebase URL 토큰 뒤에 확장자가 없더라도, 기존 판별 기준을 확장해서 체크
                    const isPdf = urlLower.includes('.pdf') || urlLower.includes('alt=media') && !urlLower.match(/\.(jpeg|jpg|gif|png)(\?|$)/i);
                    
                    const wrapper = document.createElement('div');
                    // 스크롤바가 생기지 않도록 가로세로를 100% 꽉 쥐어줍니다.
                    wrapper.className = "w-full flex items-center justify-center bg-white rounded-xl shadow-lg overflow-hidden relative";
                    wrapper.style.cssText = "height: 85vh; width: 100%; touch-action: pan-x pan-y pinch-zoom;";

                    if (isPdf) {
                        // ⭐️ 핵심: iframe 대신 Google Docs Viewer (또는 Mozilla PDF.js)를 사용하여 모바일/모든 브라우저 환경에서 
                        // PDF가 일관된 크기로 렌더링되도록 강제합니다. (iframe 직접 렌더링은 기기마다 결과가 다름)
                        const encodedUrl = encodeURIComponent(url);
                        // 구글 닥스 뷰어로 PDF를 우회하여 렌더링합니다. 모바일에서 훨씬 깔끔하게 열립니다.
                        const googleViewerUrl = `https://docs.google.com/viewer?url=${encodedUrl}&embedded=true`;
                        
                        wrapper.innerHTML = `<iframe src="${googleViewerUrl}" class="w-full h-full border-none" style="display:block;"></iframe>`;
                        
                        // 구글 닥스 뷰어가 실패할 경우를 대비한 폴백 링크 제공
                        const fallbackText = document.createElement('div');
                        fallbackText.className = "absolute bottom-2 left-0 right-0 text-center text-xs text-slate-500 bg-white/80 p-1";
                        fallbackText.innerHTML = `문서가 보이지 않으면 <a href="${url}" target="_blank" class="text-brand-600 underline font-bold">여기</a>를 눌러 직접 열어주세요.`;
                        wrapper.appendChild(fallbackText);
                    } else {
                        // 이미지는 object-fit: contain으로 가로세로 비율 유지하며 화면에 쏙 들어가게 합니다.
                        wrapper.innerHTML = `<img src="${url}" class="w-full h-full" style="object-fit: contain; display:block;">`;
                    }
                    viewerContent.appendChild(wrapper);
                });
            }, 300);
        };

        window.closeDocViewer = () => document.getElementById('doc-viewer-mode').classList.add('translate-y-full');
    </script>
</body>
</html>
