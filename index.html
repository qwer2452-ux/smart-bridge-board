<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Smart Bridge Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' } },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .modal-enter { opacity: 0; transform: scale(0.95); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
        
        /* 뷰어 컨테이너 스타일 */
        #viewer-content-container {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
            overflow: hidden; /* Panzoom 사용 시 스크롤바 방지 */
        }
        #viewer-content-container img, #viewer-content-container canvas {
            max-width: 100%; max-height: 100%; object-fit: contain; cursor: grab;
        }
        #viewer-content-container img:active, #viewer-content-container canvas:active { cursor: grabbing; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col hide-scroll relative overflow-x-hidden">

    <!-- 헤더 영역 -->
    <header id="main-header" class="hidden bg-white sticky top-0 z-40 border-b border-slate-200 shadow-sm px-5 py-4 flex justify-between items-center">
        <h1 id="header-title" class="text-slate-800 font-extrabold text-xl tracking-tight">Smart Bridge Board</h1>
        <button id="btn-logout" class="hidden text-xs bg-slate-100 text-slate-600 border border-slate-200 px-3 py-1.5 rounded-lg font-bold hover:bg-slate-200 transition">로그아웃</button>
    </header>

    <main class="flex-1 w-full max-w-md mx-auto relative flex flex-col h-full">
        
        <!-- 1. 로그인 뷰 (하늘색 바탕, 파란색 조타 핸들) -->
        <section id="view-login" class="hidden flex-col items-center justify-center min-h-screen p-6 bg-sky-50">
            <div class="w-full max-w-sm">
                <div class="text-center mb-10">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white shadow-lg mb-4 text-brand-600">
                        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="7"></circle>
                            <circle cx="12" cy="12" r="2.5"></circle>
                            <line x1="12" y1="1" x2="12" y2="5"></line>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                            <line x1="1" y1="12" x2="5" y2="12"></line>
                            <line x1="19" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="4.22" x2="7.05" y2="7.05"></line>
                            <line x1="16.95" y1="16.95" x2="19.78" y2="19.78"></line>
                            <line x1="4.22" y1="19.78" x2="7.05" y2="16.95"></line>
                            <line x1="16.95" y1="7.05" x2="19.78" y2="4.22"></line>
                        </svg>
                    </div>
                    <h2 class="text-3xl font-extrabold text-slate-800 mb-2 tracking-tight">Smart Bridge Board</h2>
                    <p class="text-sky-700 font-bold">관리자 전용 로그인</p>
                </div>
                <div class="bg-white p-6 rounded-3xl border border-sky-100 shadow-xl shadow-sky-900/5">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1.5 ml-1">이메일(아이디)</label>
                            <input type="email" id="login-email" class="w-full bg-slate-50 text-slate-800 border border-slate-200 rounded-xl px-4 py-3.5 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/50 transition font-medium" placeholder="admin@ship.com">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1.5 ml-1">비밀번호</label>
                            <input type="password" id="login-password" class="w-full bg-slate-50 text-slate-800 border border-slate-200 rounded-xl px-4 py-3.5 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/50 transition font-medium" placeholder="••••••••">
                        </div>
                        <button id="btn-do-login" class="w-full bg-brand-600 text-white font-extrabold py-4 rounded-xl mt-4 shadow-lg shadow-brand-500/30 hover:bg-brand-500 active:scale-[0.98] transition">관리자 접속</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- 2. 관리자 홈 (선박 그리드) -->
        <section id="view-admin-home" class="hidden flex-col p-5 space-y-6 flex-1">
            <div class="mb-2 mt-4">
                <h2 class="text-2xl font-extrabold text-slate-800 mb-1">내 선박 관리</h2>
                <p class="text-sm text-slate-500 font-medium">관리 중인 선박을 선택하세요.</p>
            </div>
            <div id="ship-grid" class="grid grid-cols-2 gap-4">
                <!-- 선박 타일들이 여기에 추가됨 -->
            </div>
        </section>

        <!-- 3. 관리자 대시보드 (특정 선박 관리) -->
        <section id="view-admin-dashboard" class="hidden flex-col p-5 space-y-6 flex-1 pb-24 bg-slate-50">
            <div class="flex items-center gap-3 mt-2 mb-2">
                <button onclick="showView('admin-home')" class="w-10 h-10 flex items-center justify-center bg-white border border-slate-200 rounded-full shadow-sm text-slate-600 active:bg-slate-100">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <h2 class="text-2xl font-extrabold text-slate-800 tracking-tight" id="dashboard-ship-title">선박 이름</h2>
            </div>

            <!-- 선박 설정 모듈 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                <div class="flex items-center justify-between">
                    <h3 class="font-extrabold text-slate-700 flex items-center gap-2"><span class="text-lg">⚙️</span> 선박 설정</h3>
                </div>
                <div class="flex gap-2">
                    <button onclick="promptEditShipName()" class="flex-1 bg-slate-100 text-slate-600 py-2.5 rounded-xl text-sm font-bold active:bg-slate-200">이름 변경</button>
                    <button onclick="promptDeleteShip()" class="flex-1 bg-red-50 text-red-600 py-2.5 rounded-xl text-sm font-bold active:bg-red-100">선박 삭제</button>
                </div>
                <div class="pt-3 border-t border-slate-100 flex gap-2">
                    <button onclick="showQRCode()" class="flex-1 bg-slate-800 text-white py-3 rounded-xl text-sm font-bold shadow-md flex justify-center items-center gap-2"><span class="text-lg">🔲</span> QR 생성</button>
                    <button onclick="copyShareLink()" class="flex-1 bg-brand-50 text-brand-700 py-3 rounded-xl text-sm font-bold flex justify-center items-center gap-2 border border-brand-100"><span class="text-lg">🔗</span> 링크 복사</button>
                </div>
                <button onclick="previewPublicView()" class="w-full bg-slate-100 text-slate-600 py-2.5 rounded-xl text-sm font-bold active:bg-slate-200 mt-2">📱 열람자 화면 미리보기</button>
            </div>

            <!-- 문서 업로드 모듈 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                <h3 class="font-extrabold text-slate-700 flex items-center gap-2"><span class="text-lg">📄</span> 새 문서 등록</h3>
                <input type="text" id="doc-title" placeholder="문서 제목 (예: 안전관리매뉴얼)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-brand-500 font-medium text-slate-800 placeholder-slate-400">
                <div class="relative w-full">
                    <input type="file" id="doc-file" accept="image/jpeg, image/png, application/pdf" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onchange="updateFileName()">
                    <div class="w-full bg-slate-50 border border-slate-200 border-dashed rounded-xl px-4 py-4 flex flex-col items-center justify-center text-slate-500 font-medium text-sm text-center">
                        <span class="text-2xl mb-1">📁</span>
                        <span id="file-name-display">터치하여 PDF 또는 이미지(20MB 이하) 선택</span>
                    </div>
                </div>
                <button id="btn-upload" class="w-full bg-brand-600 text-white font-extrabold py-3.5 rounded-xl shadow-md shadow-brand-500/20 active:bg-brand-700 transition relative overflow-hidden">
                    <span id="btn-upload-text">업로드 및 등록</span>
                    <div id="upload-progress-bar" class="absolute bottom-0 left-0 h-1 bg-green-400 w-0 transition-all duration-300"></div>
                </button>
            </div>

            <!-- 등록된 문서 관리 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="font-extrabold text-slate-700 mb-4 flex items-center gap-2"><span class="text-lg">📋</span> 등록된 문서 관리</h3>
                <div id="admin-doc-list" class="space-y-3">
                    <!-- 문서 리스트 삽입 -->
                </div>
            </div>
        </section>

        <!-- 4. 일반 열람자 뷰 (QR 스캔 시) -->
        <section id="view-public" class="hidden flex-col items-center p-6 min-h-screen bg-slate-50">
            <div class="w-full max-w-sm mt-4 mb-8 text-center bg-brand-900 rounded-3xl p-6 shadow-xl relative overflow-hidden">
                <div class="absolute top-0 right-0 opacity-10 text-9xl transform translate-x-4 -translate-y-6">⚓</div>
                <h2 id="public-ship-name" class="text-3xl font-extrabold text-white mb-2 relative z-10">로딩중...</h2>
                <p class="text-brand-100 font-medium text-sm relative z-10">안전관리 및 대응매뉴얼 게시판</p>
            </div>
            <div id="public-doc-list" class="w-full max-w-sm space-y-4">
                <!-- 버튼들 삽입 -->
            </div>
            <!-- 관리자 로그인 버튼 -->
            <button id="btn-go-login" class="fixed bottom-6 right-6 w-14 h-14 bg-white/80 backdrop-blur border border-slate-200 rounded-full shadow-lg flex items-center justify-center text-2xl active:scale-95 transition-transform z-20">⚙️</button>
        </section>
    </main>

    <!-- 모달 오버레이 (공통) -->
    <div id="modal-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 transition-opacity duration-200 opacity-0">
        
        <!-- 알림 모달 -->
        <div id="modal-alert" class="hidden bg-white w-full max-w-xs rounded-3xl p-6 shadow-2xl transform transition-transform duration-200 scale-95 text-center">
            <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <span class="text-3xl">🔔</span>
            </div>
            <p id="alert-msg" class="text-slate-700 font-bold mb-6 whitespace-pre-wrap leading-relaxed"></p>
            <button onclick="closeModal()" class="w-full bg-slate-800 text-white py-3.5 rounded-xl font-bold active:bg-slate-700 transition">확인</button>
        </div>

        <!-- 입력 모달 -->
        <div id="modal-prompt" class="hidden bg-white w-full max-w-xs rounded-3xl p-6 shadow-2xl transform transition-transform duration-200 scale-95">
            <h3 id="prompt-title" class="text-lg font-extrabold text-slate-800 mb-4 text-center">입력</h3>
            <input type="text" id="prompt-input" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 focus:outline-none focus:border-brand-500 font-medium text-slate-800 mb-5 text-center">
            <div class="flex gap-3">
                <button onclick="closeModal()" class="flex-1 bg-slate-100 text-slate-600 py-3 rounded-xl font-bold">취소</button>
                <button id="btn-prompt-confirm" class="flex-1 bg-brand-600 text-white py-3 rounded-xl font-bold shadow-md">확인</button>
            </div>
        </div>

        <!-- QR 코드 모달 -->
        <div id="modal-qr" class="hidden bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl flex-col items-center transform transition-transform duration-200 scale-95">
            <h3 class="text-lg font-extrabold text-slate-800 mb-1">전용 QR 코드</h3>
            <p id="qr-ship-label" class="text-sm font-bold text-brand-600 mb-6 bg-brand-50 px-3 py-1 rounded-full"></p>
            <div class="bg-white p-3 rounded-2xl shadow-inner border border-slate-200 mb-2">
                <div id="qrcode-container"></div>
            </div>
            <p id="qr-url-text" class="text-[10px] text-slate-400 font-medium mb-6 break-all text-center px-4 leading-tight"></p>
            <div class="flex w-full gap-3">
                <button onclick="closeModal()" class="flex-1 bg-slate-100 text-slate-600 py-3.5 rounded-xl font-bold">닫기</button>
                <button onclick="downloadQRCode()" class="flex-[1.5] bg-brand-600 text-white py-3.5 rounded-xl font-bold shadow-md flex items-center justify-center gap-2"><span class="text-lg">💾</span> 이미지 저장</button>
            </div>
        </div>
    </div>

    <!-- 뷰어 모달 (전체화면) -->
    <div id="modal-viewer" class="fixed inset-0 bg-slate-900 z-[60] hidden flex-col">
        <div class="bg-slate-900 flex justify-between items-center p-4 border-b border-slate-800 shadow-md relative z-10">
            <h3 id="viewer-title" class="text-white font-extrabold text-lg truncate pr-4">문서 보기</h3>
            <button onclick="closeViewer()" class="w-10 h-10 bg-slate-800 rounded-full flex items-center justify-center text-slate-300 hover:text-white hover:bg-slate-700 active:scale-95 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div class="flex-1 w-full bg-slate-950 relative overflow-hidden" id="viewer-body">
            <!-- 캔버스(PDF) 또는 이미지 삽입 영역 -->
            <div id="viewer-content-container"></div>
            <!-- 로딩 인디케이터 -->
            <div id="viewer-loading" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/80 z-20">
                <div class="w-10 h-10 border-4 border-slate-700 border-t-brand-500 rounded-full animate-spin mb-3"></div>
                <p class="text-slate-400 font-bold text-sm">문서를 불러오는 중...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, onSnapshot, query, where, orderBy, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAo7hgaaj4NedahYZFEQfZqbIVi596A_XQ",
            authDomain: "smart-bridge-board.firebaseapp.com",
            projectId: "smart-bridge-board",
            storageBucket: "smart-bridge-board.firebasestorage.app",
            messagingSenderId: "81406484031",
            appId: "1:81406484031:web:68bb7580e46b1d5348628a",
            measurementId: "G-7D68RX6RTB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const auth = getAuth(app);

        // PDF.js 워커 설정
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // 전역 상태
        let currentUser = null;
        let currentShipId = null; // 관리자가 대시보드에서 선택한 선박 문서 ID
        let viewShipId = null;    // URL 파라미터로 넘어온 열람용 선박 문서 ID
        let unsubShips = null;
        let unsubAdminDocs = null;
        let unsubPublicDocs = null;
        let qrCodeInstance = null;
        let panzoomInstance = null;
        const MAX_FILE_SIZE = 20 * 1024 * 1024; // 20MB

        // DOM 요소
        const header = document.getElementById('main-header');
        const headerTitle = document.getElementById('header-title');
        const viewLogin = document.getElementById('view-login');
        const viewAdminHome = document.getElementById('view-admin-home');
        const viewAdminDashboard = document.getElementById('view-admin-dashboard');
        const viewPublic = document.getElementById('view-public');
        
        // === 유틸리티 ===
        window.showAlert = (msg) => {
            document.getElementById('alert-msg').textContent = msg;
            showModal('modal-alert');
        };

        const showModal = (id) => {
            const overlay = document.getElementById('modal-overlay');
            const target = document.getElementById(id);
            document.querySelectorAll('#modal-overlay > div').forEach(el => el.classList.add('hidden'));
            target.classList.remove('hidden');
            overlay.classList.remove('hidden');
            
            // 애니메이션
            requestAnimationFrame(() => {
                overlay.classList.remove('opacity-0');
                target.classList.remove('scale-95', 'opacity-0');
            });
        };

        window.closeModal = () => {
            const overlay = document.getElementById('modal-overlay');
            const targets = document.querySelectorAll('#modal-overlay > div:not(.hidden)');
            overlay.classList.add('opacity-0');
            targets.forEach(t => t.classList.add('scale-95', 'opacity-0'));
            setTimeout(() => {
                overlay.classList.add('hidden');
                targets.forEach(t => t.classList.add('hidden'));
            }, 200);
        };

        window.showView = (viewName) => {
            viewLogin.classList.add('hidden');
            viewAdminHome.classList.add('hidden');
            viewAdminDashboard.classList.add('hidden');
            viewPublic.classList.add('hidden');
            header.classList.remove('hidden');
            document.getElementById('btn-logout').classList.add('hidden');

            if (viewName === 'login') {
                header.classList.add('hidden');
                viewLogin.classList.remove('hidden');
                viewLogin.classList.add('flex');
            } else if (viewName === 'admin-home') {
                headerTitle.textContent = "내 선박 관리";
                document.getElementById('btn-logout').classList.remove('hidden');
                viewAdminHome.classList.remove('hidden');
                viewAdminHome.classList.add('flex');
                currentShipId = null; // 대시보드 진입 해제
            } else if (viewName === 'admin-dashboard') {
                headerTitle.textContent = "선박 설정";
                viewAdminDashboard.classList.remove('hidden');
                viewAdminDashboard.classList.add('flex');
                loadAdminDashboardData();
            } else if (viewName === 'public') {
                headerTitle.textContent = "게시판 열람";
                viewPublic.classList.remove('hidden');
                viewPublic.classList.add('flex');
                loadPublicData();
            }
        };

        // === 라우팅 및 인증 ===
        const initRouter = () => {
            const params = new URLSearchParams(window.location.search);
            viewShipId = params.get('ship');

            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                if (viewShipId) {
                    // 파라미터가 있으면 로그인 여부 상관없이 무조건 열람자 모드 렌더링
                    showView('public');
                } else {
                    // 파라미터가 없을 때
                    if (user) {
                        showView('admin-home');
                        subscribeShips();
                    } else {
                        showView('login');
                    }
                }
            });
        };

        // 로그인
        document.getElementById('btn-do-login').addEventListener('click', async () => {
            const email = document.getElementById('login-email').value;
            const pwd = document.getElementById('login-password').value;
            if(!email || !pwd) return showAlert("정보를 입력하세요.");
            
            const btn = document.getElementById('btn-do-login');
            btn.textContent = "접속 중..."; btn.disabled = true;
            try {
                await signInWithEmailAndPassword(auth, email, pwd);
                // 주소창 정리 시도 (iframe 등에서 막히면 무시)
                try { if(window.location.search) window.history.replaceState({}, document.title, window.location.pathname); } catch(e){}
                viewShipId = null; 
                // onAuthStateChanged가 처리함
            } catch (e) {
                showAlert("아이디 또는 비밀번호가 올바르지 않습니다.");
                btn.textContent = "관리자 접속"; btn.disabled = false;
            }
        });

        // 로그아웃
        document.getElementById('btn-logout').addEventListener('click', async () => {
            await signOut(auth);
            if(unsubShips) unsubShips();
            if(unsubAdminDocs) unsubAdminDocs();
        });

        // 일반 뷰에서 로그인창 이동
        document.getElementById('btn-go-login').addEventListener('click', () => {
            try { window.history.replaceState({}, document.title, window.location.pathname); } catch(e){}
            viewShipId = null;
            if(currentUser) { showView('admin-home'); subscribeShips(); }
            else showView('login');
        });

        // === 관리자: 선박 관리 ===
        const subscribeShips = () => {
            if(unsubShips) unsubShips();
            // orderBy 제외 (인덱스 에러 방지)
            const q = query(collection(db, 'ships'), where('ownerId', '==', currentUser.uid));
            
            unsubShips = onSnapshot(q, async (snap) => {
                const grid = document.getElementById('ship-grid');
                grid.innerHTML = '';
                
                // + 새 선박 추가 버튼 타일
                const addBtn = document.createElement('button');
                addBtn.className = "bg-white border border-slate-200 border-dashed rounded-3xl p-5 flex flex-col items-center justify-center gap-2 text-slate-500 hover:bg-slate-50 hover:border-brand-300 transition h-32 active:scale-95";
                addBtn.onclick = promptAddShip;
                addBtn.innerHTML = `<span class="text-3xl">➕</span><span class="font-bold text-sm">새 선박 추가</span>`;
                grid.appendChild(addBtn);

                // JavaScript(클라이언트) 단에서 최신순 정렬
                const docs = snap.docs.map(doc => ({ id: doc.id, data: doc.data() }));
                docs.sort((a, b) => {
                    const timeA = a.data.createdAt ? a.data.createdAt.toMillis() : 0;
                    const timeB = b.data.createdAt ? b.data.createdAt.toMillis() : 0;
                    return timeB - timeA; // 내림차순 (최신순)
                });

                docs.forEach(docObj => {
                    const data = docObj.data;
                    const tile = document.createElement('button');
                    tile.className = "bg-brand-600 text-white rounded-3xl p-5 flex flex-col justify-between items-start shadow-lg shadow-brand-500/20 active:scale-95 transition h-32 text-left relative overflow-hidden";
                    tile.onclick = () => {
                        currentShipId = docObj.id;
                        document.getElementById('dashboard-ship-title').textContent = data.shipName;
                        showView('admin-dashboard');
                    };
                    
                    tile.innerHTML = `
                        <div class="absolute -right-4 -bottom-4 text-7xl opacity-20">🚢</div>
                        <span class="font-extrabold text-lg relative z-10 break-keep leading-tight">${data.shipName}</span>
                        <div class="mt-2 bg-brand-800/50 px-2.5 py-1 rounded-lg text-xs font-bold backdrop-blur-sm relative z-10">설정 열기 &rarr;</div>
                    `;
                    grid.appendChild(tile);
                });
            });
        };

        const promptAddShip = () => {
            document.getElementById('prompt-title').textContent = "새 선박 추가";
            const input = document.getElementById('prompt-input');
            input.value = "";
            input.placeholder = "선박 이름을 입력하세요";
            document.getElementById('btn-prompt-confirm').onclick = async () => {
                const name = input.value.trim();
                if(!name) return;
                closeModal();
                try {
                    await addDoc(collection(db, 'ships'), { shipName: name, ownerId: currentUser.uid, createdAt: new Date() });
                } catch(e) { showAlert("추가 실패: " + e.message); }
            };
            showModal('modal-prompt');
        };

        window.promptEditShipName = () => {
            document.getElementById('prompt-title').textContent = "선박 이름 변경";
            const input = document.getElementById('prompt-input');
            input.value = document.getElementById('dashboard-ship-title').textContent;
            
            document.getElementById('btn-prompt-confirm').onclick = async () => {
                const newName = input.value.trim();
                if(!newName) return;
                closeModal();
                try {
                    await updateDoc(doc(db, 'ships', currentShipId), { shipName: newName });
                    document.getElementById('dashboard-ship-title').textContent = newName;
                } catch(e) { showAlert("이름 변경 실패: " + e.message); }
            };
            showModal('modal-prompt');
        };

        window.promptDeleteShip = () => {
            if(!confirm("선박을 삭제하면 등록된 모든 문서와 파일이 함께 삭제됩니다. 정말 삭제하시겠습니까?")) return;
            deleteShipExecute();
        };

        const deleteShipExecute = async () => {
            try {
                // 해당 선박의 게시물 모두 조회 (ownerId 체크 필수)
                const q = query(collection(db, 'bulletins'), where('shipId', '==', currentShipId), where('ownerId', '==', currentUser.uid));
                const snaps = await getDocs(q);
                
                // 파일 및 문서 병렬 삭제 (롤백/고아파일 방지)
                const deletePromises = snaps.docs.map(async (d) => {
                    const fileUrl = d.data().fileUrl;
                    try {
                        const fileRef = ref(storage, fileUrl);
                        await deleteObject(fileRef);
                    } catch(e) { console.warn("파일 삭제 실패 (이미 없거나 권한없음)", e); }
                    await deleteDoc(d.ref);
                });
                
                await Promise.all(deletePromises);
                
                // 마지막으로 선박 문서 삭제
                await deleteDoc(doc(db, 'ships', currentShipId));
                
                showAlert("선박이 삭제되었습니다.");
                showView('admin-home');
            } catch(e) {
                showAlert("삭제 중 오류가 발생했습니다: " + e.message);
            }
        };

        // === 관리자: 문서 대시보드 ===
        window.updateFileName = () => {
            const file = document.getElementById('doc-file').files[0];
            document.getElementById('file-name-display').textContent = file ? file.name : "터치하여 PDF 또는 이미지(20MB 이하) 선택";
        };

        // 문서 등록 (Progress & Rollback 적용)
        document.getElementById('btn-upload').addEventListener('click', async () => {
            const title = document.getElementById('doc-title').value.trim();
            const file = document.getElementById('doc-file').files[0];
            
            if(!title || !file) return showAlert("제목과 파일을 모두 입력해주세요.");
            if(file.size > MAX_FILE_SIZE) return showAlert("파일 용량이 너무 큽니다 (최대 20MB).");

            // 확장자를 통한 타입 명시적 판단
            const isPdf = file.name.toLowerCase().endsWith('.pdf') || file.type === 'application/pdf';
            const fileTypeStr = isPdf ? 'pdf' : 'image';
            const fileName = `${Date.now()}_${file.name}`;
            const fileRef = ref(storage, `bulletins/${currentUser.uid}/${fileName}`);
            const uploadTask = uploadBytesResumable(fileRef, file);

            const btn = document.getElementById('btn-upload');
            const btnText = document.getElementById('btn-upload-text');
            const progress = document.getElementById('upload-progress-bar');
            
            btn.disabled = true;
            btnText.textContent = "업로드 준비중...";
            progress.style.width = '0%';

            uploadTask.on('state_changed', 
                (snapshot) => {
                    const p = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                    progress.style.width = p + '%';
                    btnText.textContent = `업로드 중... ${Math.round(p)}%`;
                }, 
                (error) => {
                    btn.disabled = false;
                    progress.style.width = '0%';
                    btnText.textContent = "업로드 및 등록";
                    showAlert("업로드 실패: " + error.message);
                }, 
                async () => {
                    try {
                        const url = await getDownloadURL(uploadTask.snapshot.ref);
                        try {
                            await addDoc(collection(db, 'bulletins'), {
                                shipId: currentShipId,
                                ownerId: currentUser.uid,
                                title: title,
                                fileUrl: url,
                                fileType: fileTypeStr,
                                createdAt: new Date()
                            });
                            
                            // 초기화
                            document.getElementById('doc-title').value = '';
                            document.getElementById('doc-file').value = '';
                            updateFileName();
                            showAlert("성공적으로 등록되었습니다.");
                        } catch(dbErr) {
                            // DB 등록 실패 시 스토리지 파일 롤백 삭제
                            await deleteObject(fileRef);
                            throw dbErr;
                        }
                    } catch (e) {
                        showAlert("등록 처리 중 오류: " + e.message);
                    } finally {
                        btn.disabled = false;
                        progress.style.width = '0%';
                        btnText.textContent = "업로드 및 등록";
                    }
                }
            );
        });

        const loadAdminDashboardData = () => {
            if(unsubAdminDocs) unsubAdminDocs();
            const listDiv = document.getElementById('admin-doc-list');
            
            // orderBy 제외 (인덱스 에러 방지)
            const q = query(collection(db, 'bulletins'), where('shipId', '==', currentShipId), where('ownerId', '==', currentUser.uid));
            
            unsubAdminDocs = onSnapshot(q, (snap) => {
                listDiv.innerHTML = '';
                if(snap.empty) {
                    listDiv.innerHTML = '<p class="text-center text-slate-400 font-medium py-4">등록된 문서가 없습니다.</p>';
                    return;
                }
                
                // JavaScript(클라이언트) 단에서 최신순 정렬
                const docs = snap.docs.map(doc => ({ id: doc.id, data: doc.data() }));
                docs.sort((a, b) => {
                    const timeA = a.data.createdAt ? a.data.createdAt.toMillis() : 0;
                    const timeB = b.data.createdAt ? b.data.createdAt.toMillis() : 0;
                    return timeB - timeA;
                });
                
                docs.forEach(docObj => {
                    const data = docObj.data;
                    const docId = docObj.id;
                    
                    const wrap = document.createElement('div');
                    wrap.className = "flex items-center bg-slate-50 border border-slate-100 rounded-xl p-3 shadow-sm";
                    
                    const iconWrap = document.createElement('div');
                    iconWrap.className = "w-10 h-10 bg-white rounded-lg border border-slate-200 flex items-center justify-center mr-3 flex-shrink-0 text-xl";
                    iconWrap.textContent = data.fileType === 'pdf' ? "📄" : "🖼️";
                    wrap.appendChild(iconWrap);
                    
                    const titleWrap = document.createElement('div');
                    titleWrap.className = "flex-1 overflow-hidden";
                    
                    const titleBtn = document.createElement('button');
                    titleBtn.className = "font-extrabold text-slate-700 text-left w-full truncate hover:text-brand-600 focus:outline-none";
                    titleBtn.textContent = data.title;
                    titleBtn.onclick = () => openViewer(data.fileUrl, data.title, data.fileType);
                    
                    const dateText = document.createElement('p');
                    dateText.className = "text-[10px] text-slate-400 font-medium mt-0.5";
                    dateText.textContent = data.createdAt ? new Date(data.createdAt.toDate()).toLocaleDateString() : '최근';
                    
                    titleWrap.appendChild(titleBtn);
                    titleWrap.appendChild(dateText);
                    wrap.appendChild(titleWrap);
                    
                    const delBtn = document.createElement('button');
                    delBtn.className = "ml-2 p-2.5 bg-red-50 text-red-500 rounded-lg font-bold text-xs hover:bg-red-100 active:scale-95 transition whitespace-nowrap";
                    delBtn.textContent = "삭제";
                    delBtn.onclick = () => deleteBulletin(docId, data.fileUrl);
                    wrap.appendChild(delBtn);
                    
                    listDiv.appendChild(wrap);
                });
            });
        };

        const deleteBulletin = async (docId, fileUrl) => {
            if(!confirm("정말 이 문서를 삭제하시겠습니까?")) return;
            try {
                try {
                    await deleteObject(ref(storage, fileUrl));
                } catch(e) { console.warn("파일이 이미 지워졌거나 접근불가", e); }
                await deleteDoc(doc(db, 'bulletins', docId));
                showAlert("삭제되었습니다.");
            } catch(e) {
                showAlert("삭제 실패: " + e.message);
            }
        };

        // === QR 및 링크 ===
        const getShareUrl = () => {
            return `${window.location.origin}${window.location.pathname}?ship=${currentShipId}`;
        };

        window.showQRCode = () => {
            const url = getShareUrl();
            const shipName = document.getElementById('dashboard-ship-title').textContent;
            
            document.getElementById('qr-ship-label').textContent = shipName;
            document.getElementById('qr-url-text').textContent = url;
            
            const container = document.getElementById('qrcode-container');
            container.innerHTML = '';
            
            qrCodeInstance = new QRCode(container, {
                text: url, width: 160, height: 160, colorDark : "#1e293b", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.H
            });
            showModal('modal-qr');
        };

        window.downloadQRCode = () => {
            const canvas = document.querySelector('#qrcode-container canvas');
            if(!canvas) return showAlert("QR 코드가 생성되지 않았습니다.");
            const link = document.createElement('a');
            link.download = `QR_${document.getElementById('qr-ship-label').textContent}.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
        };

        window.copyShareLink = () => {
            const url = getShareUrl();
            const temp = document.createElement('textarea');
            temp.value = url;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
            showAlert("접속 링크가 복사되었습니다!");
        };

        window.previewPublicView = () => {
            window.open(getShareUrl(), '_blank');
        };

        // === 일반 열람자 ===
        const loadPublicData = async () => {
            const titleEl = document.getElementById('public-ship-name');
            const listDiv = document.getElementById('public-doc-list');
            listDiv.innerHTML = '<div class="text-center py-10"><div class="w-8 h-8 border-4 border-slate-300 border-t-brand-500 rounded-full animate-spin mx-auto mb-2"></div><p class="text-slate-500 font-medium">로딩 중...</p></div>';
            
            try {
                // shipId(문서ID)로 ship 데이터 단건 조회 (권한 없이 읽기 허용)
                const qShip = query(collection(db, 'ships'), where('__name__', '==', viewShipId));
                const shipSnap = await getDocs(qShip);
                
                if(shipSnap.empty) {
                    titleEl.textContent = "존재하지 않는 선박";
                    listDiv.innerHTML = '<p class="text-center text-slate-500 font-bold bg-white p-6 rounded-2xl border border-slate-200">잘못된 접근이거나 삭제된 선박입니다.</p>';
                    return;
                }
                
                titleEl.textContent = shipSnap.docs[0].data().shipName;

                // 해당 선박의 게시물 조회 (orderBy 제외)
                const q = query(collection(db, 'bulletins'), where('shipId', '==', viewShipId));
                unsubPublicDocs = onSnapshot(q, (snap) => {
                    listDiv.innerHTML = '';
                    if(snap.empty) {
                        listDiv.innerHTML = '<p class="text-center text-slate-500 font-bold bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">등록된 문서가 없습니다.</p>';
                        return;
                    }
                    
                    // JavaScript 단에서 최신순 정렬
                    const docs = snap.docs.map(doc => ({ data: doc.data() }));
                    docs.sort((a, b) => {
                        const timeA = a.data.createdAt ? a.data.createdAt.toMillis() : 0;
                        const timeB = b.data.createdAt ? b.data.createdAt.toMillis() : 0;
                        return timeB - timeA;
                    });
                    
                    docs.forEach(docObj => {
                        const data = docObj.data;
                        const btn = document.createElement('button');
                        btn.className = "w-full bg-white text-slate-800 font-extrabold text-left py-4 px-5 rounded-2xl shadow-sm border border-slate-200 hover:border-brand-300 active:scale-95 transition-all flex items-center justify-between";
                        btn.onclick = () => openViewer(data.fileUrl, data.title, data.fileType);
                        
                        const leftDiv = document.createElement('div');
                        leftDiv.className = "flex items-center gap-3 truncate";
                        leftDiv.innerHTML = `<span class="text-2xl">${data.fileType === 'pdf' ? "📄" : "🖼️"}</span> <span class="truncate">${data.title}</span>`;
                        
                        const rightSpan = document.createElement('span');
                        rightSpan.className = "text-brand-500 bg-brand-50 px-3 py-1 rounded-full text-xs font-bold shrink-0";
                        rightSpan.textContent = "보기";
                        
                        btn.appendChild(leftDiv);
                        btn.appendChild(rightSpan);
                        listDiv.appendChild(btn);
                    });
                });
            } catch(e) {
                titleEl.textContent = "오류 발생";
                listDiv.innerHTML = `<p class="text-center text-red-500 font-bold p-4 bg-red-50 rounded-2xl">${e.message}</p>`;
            }
        };

        // === 뷰어 엔진 (PDF.js / Image Panzoom) ===
        window.openViewer = async (url, title, fileType) => {
            const viewer = document.getElementById('modal-viewer');
            document.getElementById('viewer-title').textContent = title;
            const container = document.getElementById('viewer-content-container');
            const loading = document.getElementById('viewer-loading');
            
            container.innerHTML = '';
            loading.classList.remove('hidden');
            viewer.classList.remove('hidden');
            viewer.classList.add('flex');
            document.body.style.overflow = 'hidden';

            if(panzoomInstance) {
                panzoomInstance.destroy();
                panzoomInstance = null;
            }

            try {
                if (fileType === 'pdf') {
                    // PDF.js 렌더링
                    const loadingTask = pdfjsLib.getDocument(url);
                    const pdf = await loadingTask.promise;
                    const page = await pdf.getPage(1); // 첫 페이지만 렌더링
                    
                    // 뷰포트 크기에 맞춰 스케일 계산
                    const viewportRect = viewer.getBoundingClientRect();
                    const unscaledViewport = page.getViewport({ scale: 1 });
                    const scale = Math.min(
                        viewportRect.width / unscaledViewport.width,
                        (viewportRect.height - 60) / unscaledViewport.height // 헤더 높이 60px 제외
                    ) * 0.95; // 5% 여백

                    const viewport = page.getViewport({ scale });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    
                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                    container.appendChild(canvas);
                    
                    // PDF도 확대 축소 가능하게 Panzoom 연결
                    panzoomInstance = Panzoom(canvas, { maxScale: 5, contain: 'outside' });
                    canvas.parentElement.addEventListener('wheel', panzoomInstance.zoomWithWheel);

                } else {
                    // 이미지 렌더링
                    const img = document.createElement('img');
                    img.src = url;
                    await new Promise((resolve, reject) => {
                        img.onload = resolve;
                        img.onerror = reject;
                    });
                    container.appendChild(img);
                    
                    // Panzoom 라이브러리 연결 (부드러운 줌/이동)
                    panzoomInstance = Panzoom(img, { maxScale: 5, contain: 'outside' });
                    img.parentElement.addEventListener('wheel', panzoomInstance.zoomWithWheel);
                }
            } catch(e) {
                container.innerHTML = `<p class="text-white text-center px-4">문서를 불러오는 데 실패했습니다.<br><span class="text-sm text-slate-400">${e.message}</span></p>`;
            } finally {
                loading.classList.add('hidden');
            }
        };

        window.closeViewer = () => {
            const viewer = document.getElementById('modal-viewer');
            viewer.classList.add('hidden');
            viewer.classList.remove('flex');
            document.body.style.overflow = '';
            document.getElementById('viewer-content-container').innerHTML = '';
            if(panzoomInstance) {
                panzoomInstance.destroy();
                panzoomInstance = null;
            }
        };

        // 앱 초기화
        initRouter();

    </script>
</body>
</html>
